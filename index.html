               <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\"></line>\n                <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" transform=\"rotate(45 50 50)\"></line>\n                <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" transform=\"rotate(90 50 50)\"></line>\n                <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" transform=\"rotate(135 50 50)\"></line>\n                <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" transform=\"rotate(180 50 50)\"></line>\n                <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" transform=\"rotate(225 50 50)\"></line>\n                <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" transform=\"rotate(270 50 50)\"></line>\n                <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" transform=\"rotate(315 50 50)\"></line>\n              </g>\n              <circle cx=\"50\" cy=\"50\" r=\"28\" fill=\"url(#sgB)\"></circle>\n              <g transform=\"rotate(-7 50 50)\">\n                <path d=\"M35 47 Q41 52.5 47 47\" fill=\"none\" stroke=\"#3A2433\" stroke-width=\"2.8\" stroke-linecap=\"round\"></path>\n                <path d=\"M53 47 Q59 52.5 65 47\" fill=\"none\" stroke=\"#3A2433\" stroke-width=\"2.8\" stroke-linecap=\"round\"></path>\n                <circle cx=\"35\" cy=\"57\" r=\"4.6\" fill=\"#E8452A\" opacity=\".35\"></circle><circle cx=\"65\" cy=\"57\" r=\"4.6\" fill=\"#E8452A\" opacity=\".35\"></circle>\n                <ellipse cx=\"50\" cy=\"60\" rx=\"3.6\" ry=\"4.6\" fill=\"#3A2433\"></ellipse>\n              </g>\n              <text class=\"zz\" x=\"74\" y=\"26\">z</text>\n              <text class=\"zz z2\" x=\"84\" y=\"14\">z</text>\n              <text class=\"zz z3\" x=\"92\" y=\"6\">z</text>\n            </svg>\n          </sc-if>\n          <sc-if value=\"{{moonAwake}}\" hint-placeholder-val=\"{{false}}\">\n            <svg sc-camel-view-box=\"0 0 100 100\" aria-hidden=\"true\">\n              <defs>\n                <mask id=\"mkA\"><rect width=\"100\" height=\"100\" fill=\"#fff\"></rect><circle cx=\"68\" cy=\"40\" r=\"30\" fill=\"#000\"></circle></mask>\n                <radialGradient id=\"mgA\" cx=\"30%\" cy=\"38%\" r=\"80%\"><stop offset=\"0\" stop-color=\"#FFFBE3\"></stop><stop offset=\"1\" stop-color=\"#E7DAA2\"></stop></radialGradient>\n              </defs>\n              <circle cx=\"48\" cy=\"52\" r=\"36\" fill=\"url(#mgA)\" mask=\"url(#mkA)\"></circle>\n              <circle cx=\"25\" cy=\"48\" r=\"3\" fill=\"#3A2433\"></circle><circle cx=\"25.8\" cy=\"47\" r=\"1\" fill=\"#fff\"></circle>\n              <circle cx=\"22\" cy=\"59\" r=\"4.2\" fill=\"#FF8A65\" opacity=\".4\"></circle>\n              <path d=\"M21 63 Q27 70 34 64\" fill=\"none\" stroke=\"#3A2433\" stroke-width=\"2.6\" stroke-linecap=\"round\"></path>\n              <path class=\"twinkle\" d=\"M80 20 l2 4.6 4.6 2 -4.6 2 -2 4.6 -2 -4.6 -4.6 -2 4.6 -2z\" fill=\"#FFF6C8\"></path>\n              <path class=\"twinkle t2\" d=\"M90 56 l1.4 3 3 1.4 -3 1.4 -1.4 3 -1.4 -3 -3 -1.4 3 -1.4z\" fill=\"#FFF6C8\"></path>\n            </svg>\n          </sc-if>\n          <sc-if value=\"{{moonSleepy}}\" hint-placeholder-val=\"{{false}}\">\n            <svg sc-camel-view-box=\"0 0 100 100\" aria-hidden=\"true\">\n              <defs>\n                <mask id=\"mkB\"><rect width=\"100\" height=\"100\" fill=\"#fff\"></rect><circle cx=\"68\" cy=\"40\" r=\"30\" fill=\"#000\"></circle></mask>\n                <radialGradient id=\"mgB\" cx=\"30%\" cy=\"38%\" r=\"80%\"><stop offset=\"0\" stop-color=\"#FFF4D6\"></stop><stop offset=\"1\" stop-color=\"#DCCB98\"></stop></radialGradient>\n              </defs>\n              <circle cx=\"48\" cy=\"52\" r=\"36\" fill=\"url(#mgB)\" mask=\"url(#mkB)\"></circle>\n              <path d=\"M20 49 Q25.5 54.5 31 49\" fill=\"none\" stroke=\"#3A2433\" stroke-width=\"2.8\" stroke-linecap=\"round\"></path>\n              <circle cx=\"22\" cy=\"60\" r=\"4.2\" fill=\"#FF8A65\" opacity=\".35\"></circle>\n              <ellipse cx=\"28\" cy=\"66\" rx=\"2.6\" ry=\"3.4\" fill=\"#3A2433\"></ellipse>\n              <text class=\"zz\" x=\"62\" y=\"24\">z</text>\n              <text class=\"zz z2\" x=\"73\" y=\"13\">z</text>\n              <text class=\"zz z3\" x=\"82\" y=\"5\">z</text>\n            </svg>\n          </sc-if>\n        </div>\n\n        <div class=\"ground\">\n          <div class=\"sky-title\">{{skyTitle}}</div>\n          <div class=\"sky-sub\">{{skySub}}</div>\n        </div>\n      </div>\n\n      <div class=\"scrub\">\n        <label for=\"timeScrub\">Preview the sky: {{simLabel}}</label>\n        <input id=\"timeScrub\" type=\"range\" min=\"0\" max=\"1439\" step=\"1\" value=\"{{simValue}}\" sc-camel-on-input=\"{{onScrub}}\">\n        <button class=\"link\" sc-camel-on-click=\"{{goLive}}\">{{liveLabel}}</button>\n      </div>\n      <div class=\"locrow\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z\"></path><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"></circle></svg>\n        <span class=\"lt\"><b>{{locName}}</b><br>{{locTimes}}<br>{{locNote}}</span>\n        <button id=\"locRowBtn\" class=\"link\" type=\"button\" sc-camel-on-click=\"{{openLoc}}\">{{locBtn}}</button>\n      </div>\n    </div>\n  </section>\n\n  <main class=\"grid\">\n    <div class=\"col\">\n\n      <!-- ================= PERSONAL ================= -->\n      <sc-if value=\"{{isPersonal}}\" hint-placeholder-val=\"{{true}}\">\n        <section class=\"card\" aria-label=\"Today\">\n          <div class=\"card-head\">\n            <div>\n              <div class=\"eyebrow\">Today</div>\n              <h2 class=\"h2\">{{todayHeading}}</h2>\n            </div>\n            <div class=\"count\">{{todayDone}} of {{todayTotal}} done</div>\n          </div>\n          <sc-if value=\"{{hasToday}}\" hint-placeholder-val=\"{{true}}\">\n            <ul class=\"tasks\">\n              <sc-for list=\"{{todayTasks}}\" as=\"t\" hint-placeholder-count=\"4\">\n                <li class=\"task {{t.doneCls}}\">\n                  <button class=\"chk\" sc-camel-on-click=\"{{t.toggle}}\" aria-pressed=\"{{t.done}}\" aria-label=\"{{t.aria}}\">\n                    <span class=\"box\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg></span>\n                  </button>\n                  <button class=\"tbody tbtn\" type=\"button\" sc-camel-on-click=\"{{t.open}}\" aria-label=\"{{t.openAria}}\"><span class=\"ttitle\">{{t.title}}</span><span class=\"tmeta\"><span class=\"{{t.timeCls}}\">{{t.time}}</span><span class=\"tag\">{{t.tag}}</span><span class=\"tprog\">{{t.prog}}</span></span></button>\n                </li>\n              </sc-for>\n            </ul>\n          </sc-if>\n          <sc-if value=\"{{noToday}}\" hint-placeholder-val=\"{{false}}\">\n            <div class=\"empty\">Nothing due today. Enjoy the quiet.</div>\n          </sc-if>\n        </section>\n\n        <section class=\"card\" aria-label=\"Coming up\">\n          <div class=\"card-head\">\n            <div>\n              <div class=\"eyebrow\">Coming up</div>\n              <h2 class=\"h2\">The next few days</h2>\n            </div>\n            <div class=\"count\">{{upCount}} planned</div>\n          </div>\n          <sc-for list=\"{{upGroups}}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div class=\"group\">\n              <div class=\"glabel\"><b>{{g.label}}</b><span>{{g.sub}}</span></div>\n              <ul class=\"tasks\">\n                <sc-for list=\"{{g.items}}\" as=\"t\" hint-placeholder-count=\"1\">\n                  <li class=\"task {{t.doneCls}}\">\n                    <button class=\"chk\" sc-camel-on-click=\"{{t.toggle}}\" aria-pressed=\"{{t.done}}\" aria-label=\"{{t.aria}}\">\n                      <span class=\"box\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg></span>\n                    </button>\n                    <button class=\"tbody tbtn\" type=\"button\" sc-camel-on-click=\"{{t.open}}\" aria-label=\"{{t.openAria}}\"><span class=\"ttitle\">{{t.title}}</span><span class=\"tmeta\"><span class=\"{{t.timeCls}}\">{{t.time}}</span><span class=\"tag\">{{t.tag}}</span><span class=\"tprog\">{{t.prog}}</span></span></button>\n                  </li>\n                </sc-for>\n              </ul>\n            </div>\n          </sc-for>\n        </section>\n      </sc-if>\n\n      <!-- ================= SHARED ================= -->\n      <sc-if value=\"{{isShared}}\" hint-placeholder-val=\"{{false}}\">\n        <section aria-label=\"Shared spaces\">\n          <div class=\"spaces\">\n            <sc-for list=\"{{spaces}}\" as=\"sp\" hint-placeholder-count=\"3\">\n              <button class=\"space {{sp.cls}}\" sc-camel-on-click=\"{{sp.pick}}\" aria-pressed=\"{{sp.on}}\">\n                <div>\n                  <div class=\"space-name\">{{sp.name}}</div>\n                  <div class=\"space-blurb\">{{sp.blurb}}</div>\n                </div>\n                <div class=\"space-foot\">\n                  <div class=\"stack\">\n                    <sc-for list=\"{{sp.people}}\" as=\"pp\" hint-placeholder-count=\"3\">\n                      <span class=\"av\" style=\"background: {{pp.color}}\">{{pp.initial}}</span>\n                    </sc-for>\n                  </div>\n                  <span class=\"role {{sp.roleCls}}\">You: {{sp.role}}</span>\n                </div>\n                <div>\n                  <div class=\"bar\"><i style=\"width: {{sp.pct}}%\"></i></div>\n                  <div class=\"space-blurb\">{{sp.progress}}</div>\n                </div>\n              </button>\n            </sc-for>\n          </div>\n        </section>\n\n        <section class=\"card\" aria-label=\"Space tasks\">\n          <div class=\"card-head\">\n            <div>\n              <div class=\"eyebrow\">{{curSpace.role}} access</div>\n              <h2 class=\"h2\">{{curSpace.name}}</h2>\n            </div>\n            <div class=\"count\">{{curSpace.openCount}} open</div>\n          </div>\n          <ul class=\"tasks\">\n            <sc-for list=\"{{spaceTasks}}\" as=\"t\" hint-placeholder-count=\"4\">\n              <li class=\"task {{t.doneCls}}\">\n                <button class=\"chk\" sc-camel-on-click=\"{{t.toggle}}\" aria-pressed=\"{{t.done}}\" aria-label=\"{{t.aria}}\">\n                  <span class=\"box\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg></span>\n                </button>\n                <button class=\"tbody tbtn\" type=\"button\" sc-camel-on-click=\"{{t.open}}\" aria-label=\"{{t.openAria}}\"><span class=\"ttitle\">{{t.title}}</span><span class=\"tmeta\"><span>{{t.dueLabel}}</span><span class=\"tprog\">{{t.prog}}</span></span></button>\n                <div class=\"who\"><span class=\"nm\">{{t.whoName}}</span><span class=\"av\" style=\"background: {{t.whoColor}}\">{{t.whoInitial}}</span></div>\n              </li>\n            </sc-for>\n          </ul>\n        </section>\n      </sc-if>\n\n      <!-- ================= WORK ================= -->\n      <sc-if value=\"{{isWork}}\" hint-placeholder-val=\"{{false}}\">\n        <section class=\"card wk\" aria-label=\"Work workspace\">\n          <div class=\"card-head\">\n            <div>\n              <div class=\"eyebrow\">{{wkKind}}</div>\n              <h2 class=\"h2\">{{wkOrgName}}</h2>\n            </div>\n            <div class=\"count\">{{wkRole}} access</div>\n          </div>\n          <div class=\"chips orgs\" role=\"group\" aria-label=\"Your work workspaces\">\n            <sc-for list=\"{{orgChips}}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button class=\"chip {{o.cls}}\" type=\"button\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\" aria-label=\"{{o.aria}}\">{{o.name}}<span class=\"orole\" aria-hidden=\"true\">{{o.role}}</span></button>\n            </sc-for>\n            <button class=\"chip chip-sm\" type=\"button\" sc-camel-on-click=\"{{openOrgNew}}\">+ New workspace</button>\n          </div>\n          <div class=\"wtabs\" role=\"group\" aria-label=\"Work sections\">\n            <sc-for list=\"{{wTabs}}\" as=\"t\" hint-placeholder-count=\"4\">\n              <button class=\"wtab {{t.cls}}\" type=\"button\" sc-camel-on-click=\"{{t.pick}}\" aria-pressed=\"{{t.on}}\">{{t.label}}<sc-if value=\"{{t.hasN}}\" hint-placeholder-val=\"{{true}}\"><span class=\"wn\">{{t.n}}</span></sc-if></button>\n            </sc-for>\n          </div>\n        </section>\n\n        <!-- overview -->\n        <sc-if value=\"{{wOverview}}\" hint-placeholder-val=\"{{true}}\">\n          <section class=\"card\" aria-label=\"Team overview\">\n            <div class=\"card-head\">\n              <div>\n                <div class=\"eyebrow\">Team overview</div>\n                <h2 class=\"h2\">{{ovPct}}% overall progress</h2>\n              </div>\n              <div class=\"count\">{{ovCount}} tasks</div>\n            </div>\n            <div class=\"bar\" role=\"img\" aria-label=\"Overall progress {{ovPct}} percent\"><i style=\"width: {{ovPct}}%\"></i></div>\n            <div class=\"wstats\">\n              <sc-for list=\"{{ovStats}}\" as=\"st\" hint-placeholder-count=\"4\">\n                <div class=\"wstat {{st.cls}}\"><b>{{st.n}}</b><span>{{st.label}}</span></div>\n              </sc-for>\n            </div>\n            <h3 class=\"wsub\">By status</h3>\n            <div class=\"wbars\">\n              <sc-for list=\"{{ovStatus}}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div class=\"wbrow\"><span>{{r.label}}</span><div class=\"bar thin\"><i class=\"{{r.cls}}\" style=\"width: {{r.pct}}%\"></i></div><b>{{r.n}}</b></div>\n              </sc-for>\n            </div>\n          </section>\n\n          <section class=\"card\" aria-label=\"Needs attention\">\n            <div class=\"eyebrow\">Needs attention</div>\n            <sc-if value=\"{{hasAttn}}\" hint-placeholder-val=\"{{true}}\">\n              <ul class=\"tasks\" style=\"margin-top:10px\">\n                <sc-for list=\"{{ovAttn}}\" as=\"a\" hint-placeholder-count=\"3\">\n                  <li class=\"task\"><button class=\"tbody tbtn\" type=\"button\" sc-camel-on-click=\"{{a.open}}\" aria-label=\"{{a.openAria}}\"><span class=\"ttitle\">{{a.title}}</span><span class=\"tmeta\"><span class=\"{{a.cls}}\">{{a.sub}}</span></span></button></li>\n                </sc-for>\n              </ul>\n            </sc-if>\n            <sc-if value=\"{{noAttn}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\">Nothing is overdue or urgent. Nice and calm.</div></sc-if>\n          </section>\n\n          <section class=\"card\" aria-label=\"Teams and workload\">\n            <div class=\"eyebrow\">Teams</div>\n            <sc-if value=\"{{hasOvTeams}}\" hint-placeholder-val=\"{{true}}\">\n              <div style=\"margin-top:8px\">\n                <sc-for list=\"{{ovTeams}}\" as=\"t\" hint-placeholder-count=\"2\">\n                  <div class=\"wprow\"><div><b>{{t.name}}</b><div class=\"sub\">{{t.sub}}</div></div><span class=\"fr\">{{t.pct}}%</span><div class=\"bar\"><i style=\"width: {{t.pct}}%\"></i></div></div>\n                </sc-for>\n              </div>\n            </sc-if>\n            <sc-if value=\"{{noOvTeams}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\">No teams yet. Add one from the People tab.</div></sc-if>\n            <div class=\"eyebrow\" style=\"margin-top:20px\">Workload</div>\n            <div style=\"margin-top:8px\">\n              <sc-for list=\"{{ovLoad}}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div class=\"member\">\n                  <span class=\"av lg\" style=\"background: {{m.color}}\">{{m.initial}}</span>\n                  <div><div class=\"nm\">{{m.name}} <span class=\"role\">{{m.role}}</span></div></div>\n                  <span class=\"fr\">{{m.frac}}</span>\n                  <div class=\"bar\"><i style=\"width: {{m.pct}}%\"></i></div>\n                </div>\n              </sc-for>\n            </div>\n          </section>\n        </sc-if>\n\n        <!-- tasks -->\n        <sc-if value=\"{{wTasksTab}}\" hint-placeholder-val=\"{{false}}\">\n          <section class=\"card\" aria-label=\"Work tasks\">\n            <div class=\"card-head\">\n              <div>\n                <div class=\"eyebrow\">Tasks</div>\n                <h2 class=\"h2\">{{wkOrgName}}</h2>\n              </div>\n              <button class=\"chip chip-sm on\" type=\"button\" sc-camel-on-click=\"{{wNewTask}}\">+ New task</button>\n            </div>\n            <div class=\"wfilters\">\n              <div class=\"chips\" role=\"group\" aria-label=\"Filter by status\">\n                <sc-for list=\"{{fStatus}}\" as=\"f\" hint-placeholder-count=\"5\">\n                  <button class=\"chip chip-sm {{f.cls}}\" type=\"button\" sc-camel-on-click=\"{{f.pick}}\" aria-pressed=\"{{f.on}}\">{{f.label}} <span class=\"wn\">{{f.n}}</span></button>\n                </sc-for>\n              </div>\n              <div class=\"chips\" role=\"group\" aria-label=\"Filter by assignee\">\n                <sc-for list=\"{{fWho}}\" as=\"f\" hint-placeholder-count=\"2\">\n                  <button class=\"chip chip-sm {{f.cls}}\" type=\"button\" sc-camel-on-click=\"{{f.pick}}\" aria-pressed=\"{{f.on}}\">{{f.label}}</button>\n                </sc-for>\n              </div>\n              <div class=\"chips\" role=\"group\" aria-label=\"Filter by project\">\n                <sc-for list=\"{{fProj}}\" as=\"f\" hint-placeholder-count=\"4\">\n                  <button class=\"chip chip-sm {{f.cls}}\" type=\"button\" sc-camel-on-click=\"{{f.pick}}\" aria-pressed=\"{{f.on}}\">{{f.label}}</button>\n                </sc-for>\n              </div>\n            </div>\n            <sc-if value=\"{{noWRows}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\" role=\"status\">{{wRowsHint}}</div></sc-if>\n            <ul class=\"tasks wlist\">\n              <sc-for list=\"{{wRows}}\" as=\"t\" hint-placeholder-count=\"4\">\n                <li class=\"task {{t.doneCls}}\">\n                  <button class=\"chk\" type=\"button\" sc-camel-on-click=\"{{t.toggle}}\" aria-pressed=\"{{t.done}}\" aria-label=\"{{t.aria}}\">\n                    <span class=\"box\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg></span>\n                  </button>\n                  <button class=\"tbody tbtn\" type=\"button\" sc-camel-on-click=\"{{t.open}}\" aria-label=\"{{t.openAria}}\">\n                    <span class=\"ttitle\">{{t.title}}</span>\n                    <span class=\"tmeta\"><span class=\"wbadge {{t.prioCls}}\">{{t.prio}}</span><span class=\"wbadge {{t.stCls}}\">{{t.status}}</span><span>{{t.project}}</span><span class=\"{{t.dueCls}}\">{{t.due}}</span><span>{{t.pct}}%</span><span>{{t.talk}}</span></span>\n                  </button>\n                  <div class=\"who\"><span class=\"avs\" role=\"img\" aria-label=\"{{t.whoText}}\">\n                    <sc-for list=\"{{t.who}}\" as=\"w\" hint-placeholder-count=\"2\"><span class=\"av\" style=\"background: {{w.color}}\">{{w.initial}}</span></sc-for>\n                  </span></div>\n                </li>\n              </sc-for>\n            </ul>\n            <div class=\"fieldnote\">{{wNewNote}}</div>\n          </section>\n        </sc-if>\n\n        <!-- projects -->\n        <sc-if value=\"{{wProjectsTab}}\" hint-placeholder-val=\"{{false}}\">\n          <section class=\"card\" aria-label=\"Projects and departments\">\n            <div class=\"eyebrow\">Projects and departments</div>\n            <div style=\"margin-top:8px\">\n              <sc-for list=\"{{projRows}}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div class=\"wprow wproj\">\n                  <div><b>{{p.name}}</b> <span class=\"role\">{{p.dept}}</span><div class=\"sub\">{{p.sub}}</div></div>\n                  <button class=\"chip chip-sm\" type=\"button\" sc-camel-on-click=\"{{p.view}}\" aria-label=\"{{p.viewAria}}\">View tasks</button>\n                  <div class=\"bar\"><i style=\"width: {{p.pct}}%\"></i></div>\n                </div>\n              </sc-for>\n            </div>\n            <sc-if value=\"{{wCanProjects}}\" hint-placeholder-val=\"{{true}}\">\n              <form class=\"wform\" sc-camel-on-submit=\"{{addProject}}\">\n                <div class=\"field\"><label for=\"wProjIn\">New project</label>\n                  <input id=\"wProjIn\" class=\"input\" type=\"text\" placeholder=\"Project name, e.g. Q1 campaign\" value=\"{{wProjName}}\" sc-camel-on-input=\"{{onWProjName}}\" autocomplete=\"off\"></div>\n                <div class=\"field\"><label for=\"wProjDeptIn\">Department (optional)</label>\n                  <input id=\"wProjDeptIn\" class=\"input\" type=\"text\" placeholder=\"Design, Engineering, Operations\" value=\"{{wProjDept}}\" sc-camel-on-input=\"{{onWProjDept}}\" autocomplete=\"off\"></div>\n                <button class=\"btn-primary wsubmit\" type=\"submit\">Add project</button>\n              </form>\n            </sc-if>\n            <sc-if value=\"{{wNoProjPerm}}\" hint-placeholder-val=\"{{false}}\"><div class=\"notice\">Only Owners, Admins and Managers can add projects.</div></sc-if>\n            <sc-if value=\"{{hasWMsg}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\" role=\"alert\">{{wMsg}}</div></sc-if>\n          </section>\n        </sc-if>\n\n        <!-- people -->\n        <sc-if value=\"{{wPeopleTab}}\" hint-placeholder-val=\"{{false}}\">\n          <section class=\"card\" aria-label=\"Members\">\n            <div class=\"eyebrow\">Members and roles</div>\n            <div style=\"margin-top:8px\">\n              <sc-for list=\"{{memberRows}}\" as=\"m\" hint-placeholder-count=\"4\">\n                <div class=\"wmem\">\n                  <span class=\"av lg\" style=\"background: {{m.color}}\">{{m.initial}}</span>\n                  <div class=\"wmid\"><div class=\"nm\">{{m.name}}</div><div class=\"sub\">{{m.email}}</div><div class=\"sub\">{{m.teams}}</div></div>\n                  <div class=\"wact\">\n                    <sc-if value=\"{{m.canChange}}\" hint-placeholder-val=\"{{false}}\">\n                      <select class=\"input sel\" aria-label=\"{{m.roleAria}}\" sc-camel-on-change=\"{{m.onRole}}\">\n                        <sc-for list=\"{{m.roleOpts}}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{o.v}}\" selected=\"{{o.on}}\">{{o.v}}</option></sc-for>\n                      </select>\n                    </sc-if>\n                    <sc-if value=\"{{m.canRemove}}\" hint-placeholder-val=\"{{false}}\"><button class=\"chip chip-sm\" type=\"button\" sc-camel-on-click=\"{{m.rem}}\" aria-label=\"{{m.remAria}}\">{{m.remLabel}}</button></sc-if>\n                    <span class=\"role {{m.roleCls}}\">{{m.role}}</span>\n                  </div>\n                </div>\n              </sc-for>\n            </div>\n            <div class=\"fieldnote\">Roles: Owner controls everything. Admin manages people, teams and projects. Manager runs projects and teams and assigns work. Member works on tasks. Viewer follows along.</div>\n          </section>\n\n          <section class=\"card\" aria-label=\"Teams\">\n            <div class=\"eyebrow\">Teams</div>\n            <sc-if value=\"{{noTeams}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\">No teams yet. Create one to group people, then see progress by team in the Overview.</div></sc-if>\n            <sc-for list=\"{{teamCards}}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div class=\"wteam\">\n                <div class=\"nm\"><b>{{t.name}}</b> <span class=\"sub\">{{t.count}}</span></div>\n                <div class=\"chips\" role=\"group\" aria-label=\"Members of {{t.name}}\">\n                  <sc-for list=\"{{t.chips}}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <button class=\"chip chip-sm {{c.cls}}\" type=\"button\" sc-camel-on-click=\"{{c.toggle}}\" aria-pressed=\"{{c.on}}\" aria-label=\"{{c.aria}}\">{{c.name}}</button>\n                  </sc-for>\n                </div>\n              </div>\n            </sc-for>\n            <sc-if value=\"{{wCanTeams}}\" hint-placeholder-val=\"{{true}}\">\n              <form class=\"wform\" sc-camel-on-submit=\"{{addTeam}}\">\n                <div class=\"field\"><label for=\"wTeamIn\">New team</label>\n                  <input id=\"wTeamIn\" class=\"input\" type=\"text\" placeholder=\"Team name, e.g. Marketing\" value=\"{{wTeamName}}\" sc-camel-on-input=\"{{onWTeamName}}\" autocomplete=\"off\"></div>\n                <button class=\"btn-primary wsubmit\" type=\"submit\">Create team</button>\n              </form>\n            </sc-if>\n            <sc-if value=\"{{wNoTeamPerm}}\" hint-placeholder-val=\"{{false}}\"><div class=\"notice\">Only Owners, Admins and Managers can organise teams.</div></sc-if>\n          </section>\n\n          <section class=\"card\" aria-label=\"Invite people\">\n            <div class=\"eyebrow\">Invite people</div>\n            <sc-if value=\"{{wCanMembers}}\" hint-placeholder-val=\"{{true}}\">\n              <form class=\"wform\" sc-camel-on-submit=\"{{sendWInvite}}\" novalidate>\n                <div class=\"field\"><label for=\"wInvEmail\">Email address</label>\n                  <input id=\"wInvEmail\" class=\"input\" type=\"email\" placeholder=\"colleague@company.com\" value=\"{{wInvEmail}}\" sc-camel-on-input=\"{{onWInvEmail}}\" autocomplete=\"off\"></div>\n                <div class=\"field\"><label for=\"wInvRole\">Role</label>\n                  <select id=\"wInvRole\" class=\"input sel\" sc-camel-on-change=\"{{onWInvRole}}\">\n                    <sc-for list=\"{{invOpts}}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{o.v}}\" selected=\"{{o.on}}\">{{o.v}}</option></sc-for>\n                  </select></div>\n                <sc-if value=\"{{hasWInvErr}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\" role=\"alert\">{{wInvErr}}</div></sc-if>\n                <button class=\"btn-primary wsubmit\" type=\"submit\">Save invitation</button>\n              </form>\n              <sc-if value=\"{{hasInvW}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"margin-top:10px\" aria-label=\"Pending invitations\">\n                  <sc-for list=\"{{invRowsW}}\" as=\"iv\" hint-placeholder-count=\"1\">\n                    <div class=\"pend wpend\"><span><b>{{iv.email}}</b><br>{{iv.when}} · pending</span>\n                      <span class=\"wact\">\n                        <select class=\"input sel\" aria-label=\"{{iv.roleAria}}\" sc-camel-on-change=\"{{iv.onRole}}\"><sc-for list=\"{{iv.roleOpts}}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{o.v}}\" selected=\"{{o.on}}\">{{o.v}}</option></sc-for></select>\n                        <button class=\"chip chip-sm\" type=\"button\" sc-camel-on-click=\"{{iv.copy}}\" aria-label=\"{{iv.copyAria}}\">Copy message</button>\n                        <button class=\"chip chip-sm\" type=\"button\" sc-camel-on-click=\"{{iv.revoke}}\" aria-label=\"{{iv.revokeAria}}\">Revoke</button>\n                      </span></div>\n                  </sc-for>\n                </div>\n              </sc-if>\n              <sc-if value=\"{{hasWInvMsg}}\" hint-placeholder-val=\"{{false}}\">\n                <div class=\"field\"><label for=\"wInvText\">Message for {{wInvMsgFor}}</label>\n                  <textarea id=\"wInvText\" class=\"input area\" rows=\"5\" readonly=\"\" value=\"{{wInvMsgText}}\"></textarea></div>\n              </sc-if>\n              <div class=\"demo-flag\">Invitations are saved on this page only. Sending the email, signing the person up and adding them as a member needs a backend, so invited people do not appear in the member list.</div>\n            </sc-if>\n            <sc-if value=\"{{wNoMemberPerm}}\" hint-placeholder-val=\"{{false}}\"><div class=\"notice\">Only Owners and Admins can invite people or change roles in {{wkOrgName}}.</div></sc-if>\n          </section>\n        </sc-if>\n      </sc-if>\n\n    </div>\n\n    <aside class=\"col\">\n\n      <!-- flip calendar -->\n      <section class=\"card\" aria-label=\"Calendar\">\n        <div class=\"calbar\">\n          <div>\n            <div class=\"eyebrow\">Calendar</div>\n            <div class=\"sub\" style=\"margin-top:6px\">{{calScope}}</div>\n          </div>\n          <div class=\"nav\">\n            <button class=\"nav-btn wide\" sc-camel-on-click=\"{{goToday}}\">Today</button>\n            <button class=\"nav-btn\" sc-camel-on-click=\"{{prevMonth}}\" aria-label=\"Previous month\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"></path></svg>\n            </button>\n            <button class=\"nav-btn\" sc-camel-on-click=\"{{nextMonth}}\" aria-label=\"Next month\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"></path></svg>\n            </button>\n          </div>\n        </div>\n\n        <div class=\"cal\">\n          <div class=\"rings\" aria-hidden=\"true\">\n            <span class=\"ring\"></span><span class=\"ring\"></span><span class=\"ring\"></span><span class=\"ring\"></span><span class=\"ring\"></span><span class=\"ring\"></span><span class=\"ring\"></span>\n          </div>\n          <div class=\"pages\">\n            <sc-for list=\"{{layers}}\" as=\"L\" hint-placeholder-count=\"1\">\n              <div class=\"layer {{L.cls}}\">\n                <div class=\"page\">\n                  <div class=\"page-head\"><span class=\"mo\">{{L.month}}</span><span class=\"yr\">{{L.year}}</span></div>\n                  <div class=\"perf\" aria-hidden=\"true\"></div>\n                  <div class=\"dow\" aria-hidden=\"true\"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>\n                  <div class=\"days\">\n                    <sc-for list=\"{{L.cells}}\" as=\"c\" hint-placeholder-count=\"42\">\n                      <button class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\" aria-label=\"{{c.label}}\">\n                        <span>{{c.n}}</span>\n                        <span class=\"dots\"><sc-for list=\"{{c.dots}}\" as=\"d\" hint-placeholder-count=\"0\"><i class=\"dot\"></i></sc-for></span>\n                      </button>\n                    </sc-for>\n                  </div>\n                </div>\n              </div>\n            </sc-for>\n          </div>\n        </div>\n      </section>\n\n      <!-- selected day -->\n      <section class=\"card\" aria-label=\"Selected day\">\n        <div class=\"eyebrow\">{{selEyebrow}}</div>\n        <div class=\"detail-title\" style=\"margin-top:8px\">{{selTitle}}</div>\n        <sc-if value=\"{{hasSel}}\" hint-placeholder-val=\"{{true}}\">\n          <ul class=\"detail-list\">\n            <sc-for list=\"{{selItems}}\" as=\"it\" hint-placeholder-count=\"2\">\n              <li><i class=\"dot\"></i><div>{{it.title}}<small>{{it.note}}</small></div></li>\n            </sc-for>\n          </ul>\n        </sc-if>\n        <sc-if value=\"{{noSel}}\" hint-placeholder-val=\"{{false}}\">\n          <div class=\"sub\">A clear day so far.</div>\n          <button class=\"chip\" style=\"margin-top:12px\" sc-camel-on-click=\"{{planSel}}\">Plan something</button>\n        </sc-if>\n      </section>\n\n      <!-- personal progress -->\n      <sc-if value=\"{{isPersonal}}\" hint-placeholder-val=\"{{true}}\">\n        <section class=\"card\" aria-label=\"Progress\">\n          <div class=\"eyebrow\">Your progress</div>\n          <div class=\"ringrow\" style=\"margin-top:14px\">\n            <div class=\"ringbox\">\n              <svg sc-camel-view-box=\"0 0 96 96\" aria-hidden=\"true\">\n                <circle class=\"trk\" cx=\"48\" cy=\"48\" r=\"38\" fill=\"none\" stroke-width=\"10\"></circle>\n                <circle class=\"val\" cx=\"48\" cy=\"48\" r=\"38\" fill=\"none\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-dasharray=\"238.76\" stroke-dashoffset=\"{{ringOffset}}\"></circle>\n              </svg>\n              <b><span>{{todayPct}}%</span></b>\n            </div>\n            <div>\n              <div class=\"big\">{{progressLine}}</div>\n              <div class=\"sub\">{{weekLine}}</div>\n            </div>\n          </div>\n          <div class=\"week\" role=\"img\" aria-label=\"Completion this week\">\n            <sc-for list=\"{{weekBars}}\" as=\"b\" hint-placeholder-count=\"7\">\n              <div class=\"wbar {{b.cls}}\"><i style=\"height: {{b.h}}px\"></i><span>{{b.d}}</span></div>\n            </sc-for>\n          </div>\n          <button class=\"streak\" type=\"button\" sc-camel-on-click=\"{{goStreaks}}\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 1.5 1 2 1.5 2C10.5 8 11 5.5 12 3z\"></path></svg>\n            {{streakChip}}\n          </button>\n        </section>\n      </sc-if>\n\n      <!-- shared progress -->\n      <sc-if value=\"{{isShared}}\" hint-placeholder-val=\"{{false}}\">\n        <section class=\"card\" aria-label=\"Who is doing what\">\n          <div class=\"eyebrow\">Who is doing what</div>\n          <div class=\"sub\" style=\"margin-top:6px\">{{curSpace.name}} · {{curSpace.people}} people</div>\n          <div style=\"margin-top:8px\">\n            <sc-for list=\"{{members}}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div class=\"member\">\n                <span class=\"av lg\" style=\"background: {{m.color}}\">{{m.initial}}</span>\n                <div>\n                  <div class=\"nm\">{{m.name}} <span class=\"role {{m.roleCls}}\">{{m.role}}</span></div>\n                </div>\n                <span class=\"fr\">{{m.frac}}</span>\n                <div class=\"bar\"><i style=\"width: {{m.pct}}%\"></i></div>\n              </div>\n            </sc-for>\n          </div>\n          <sc-if value=\"{{hasInv}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"margin-top:6px\" aria-label=\"Pending invitations\">\n              <sc-for list=\"{{invRows}}\" as=\"iv\" hint-placeholder-count=\"1\">\n                <div class=\"pend\"><span><b>{{iv.email}}</b><br>{{iv.role}} · pending</span><span>{{iv.when}}</span></div>\n              </sc-for>\n            </div>\n          </sc-if>\n          <button id=\"inviteBtn\" class=\"invite\" type=\"button\" sc-camel-on-click=\"{{invite}}\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5.5\" width=\"18\" height=\"13\" rx=\"3\"></rect><path d=\"M4 8l8 6 8-6\"></path></svg>\n            Invite someone by email\n          </button>\n        </section>\n      </sc-if>\n\n      <!-- work access -->\n      <sc-if value=\"{{isWork}}\" hint-placeholder-val=\"{{false}}\">\n        <section class=\"card\" aria-label=\"Your access\">\n          <div class=\"eyebrow\">Your access</div>\n          <div class=\"sub\" style=\"margin-top:6px\">{{wkOrgName}} · you are <span class=\"role {{wkRoleCls}}\">{{wkRole}}</span></div>\n          <ul class=\"waccess\">\n            <sc-for list=\"{{accessRows}}\" as=\"a\" hint-placeholder-count=\"7\">\n              <li class=\"{{a.cls}}\"><span>{{a.label}}</span><b>{{a.mark}}</b></li>\n            </sc-for>\n          </ul>\n          <div class=\"fieldnote\">{{wAccessNote}}</div>\n        </section>\n      </sc-if>\n\n    </aside>\n  </main>\n  </sc-if>\n\n  <!-- ================= PROFILE ================= -->\n  <sc-if value=\"{{isProfile}}\" hint-placeholder-val=\"{{false}}\">\n  <section class=\"subpage\" aria-label=\"Profile\">\n    <button class=\"back\" type=\"button\" sc-camel-on-click=\"{{goHome}}\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"></path></svg>\n      Back to dashboard\n    </button>\n    <h1 class=\"page-title\">Your profile</h1>\n    <p class=\"page-sub\">How you appear in Taskora, and a look at how your days have been going.</p>\n\n    <div class=\"profile-grid\">\n      <div class=\"card profile-card\">\n        <div class=\"p-av\" style=\"background: {{pAvColor}}\" aria-hidden=\"true\">{{pAvInitials}}</div>\n\n        <sc-if value=\"{{notEditing}}\" hint-placeholder-val=\"{{true}}\">\n          <h2 class=\"p-name\">{{uName}}</h2>\n          <div class=\"p-meta\">{{uEmail}}</div>\n          <div class=\"p-since\">{{uSince}}</div>\n          <div class=\"p-actions\">\n            <button class=\"chip\" type=\"button\" sc-camel-on-click=\"{{startEdit}}\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z\"></path><path d=\"M13.5 6.5l4 4\"></path></svg>\n              Edit profile\n            </button>\n          </div>\n          <div class=\"demo-flag\" style=\"text-align:center\">Demo sign-in only. Your tasks, profile and progress are saved in this browser, not on a server.</div>\n          <sc-if value=\"{{isDemoUser}}\" hint-placeholder-val=\"{{false}}\"><div style=\"text-align:center\"><button class=\"linkbtn sm\" type=\"button\" sc-camel-on-click=\"{{resetDemo}}\" style=\"margin-top:6px\">{{resetLabel}}</button></div></sc-if>\n        </sc-if>\n\n        <sc-if value=\"{{editing}}\" hint-placeholder-val=\"{{false}}\">\n          <form class=\"edit-form\" sc-camel-on-submit=\"{{saveEdit}}\" novalidate=\"\">\n            <div class=\"field\">\n              <label for=\"edName\">Full name</label>\n              <input id=\"edName\" class=\"input {{edCls}}\" type=\"text\" autocomplete=\"name\" maxlength=\"60\" value=\"{{edName}}\" sc-camel-on-input=\"{{onEdName}}\" aria-invalid=\"{{hasEdErr}}\">\n              <sc-if value=\"{{hasEdErr}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\">{{edErr}}</div></sc-if>\n            </div>\n            <div class=\"field\">\n              <span class=\"lab\">Email</span>\n              <div class=\"emailview\">{{uEmail}}</div>\n              <div class=\"fieldnote\">Changing your email needs verification, which arrives with the real backend.</div>\n            </div>\n            <div class=\"field\">\n              <span class=\"lab\">Avatar colour</span>\n              <div class=\"swatches\">\n                <sc-for list=\"{{swatches}}\" as=\"c\" hint-placeholder-count=\"6\">\n                  <button class=\"sw {{c.cls}}\" type=\"button\" sc-camel-on-click=\"{{c.pick}}\" aria-label=\"{{c.name}}\" aria-pressed=\"{{c.on}}\"><i style=\"background: {{c.hex}}\"></i></button>\n                </sc-for>\n              </div>\n            </div>\n            <div class=\"field\">\n              <span class=\"lab\">Live preview</span>\n              <div class=\"pvbox\" role=\"group\" aria-label=\"Preview of your avatar colour\">\n                <div class=\"pvrow\">\n                  <span class=\"avatar-btn pvfake\" aria-hidden=\"true\"><span class=\"av\" style=\"background: {{pvColor}}\">{{pvInitials}}</span><span class=\"avname\">{{pvFirst}}</span></span>\n                  <span class=\"pvnote\">Top bar</span>\n                </div>\n                <div class=\"pvrow\">\n                  <span class=\"pvwho\"><span class=\"av\" style=\"background: {{pvColor}}\" aria-hidden=\"true\">{{pvInitials}}</span><b>{{pvName}}</b></span>\n                  <span class=\"pvnote\">Shared spaces</span>\n                </div>\n              </div>\n              <div class=\"fieldnote\" role=\"status\">{{pvColorName}}. White initials have {{pvContrast}} contrast, which passes the accessibility standard. Save to keep it.</div>\n            </div>\n            <div class=\"sheet-foot\" style=\"justify-content:flex-start\">\n              <button class=\"btn-primary\" type=\"submit\">Save changes</button>\n              <button class=\"btn-quiet\" type=\"button\" sc-camel-on-click=\"{{cancelEdit}}\">Cancel</button>\n            </div>\n          </form>\n        </sc-if>\n      </div>\n\n      <div class=\"col\">\n        <div class=\"stats\">\n          <div class=\"stat\"><div class=\"n\">{{statTotal}}</div><div class=\"l\">Tasks completed</div></div>\n          <div class=\"stat\"><div class=\"n\">{{streakNow}}<small style=\"font:600 18px 'Figtree',sans-serif;color:var(--muted)\"> {{streakUnit}}</small></div><div class=\"l\">Current streak</div></div>\n          <div class=\"stat\"><div class=\"n\">{{bestNow}}<small style=\"font:600 18px 'Figtree',sans-serif;color:var(--muted)\"> {{bestUnit}}</small></div><div class=\"l\">Best streak</div></div>\n          <div class=\"stat\"><div class=\"n\">{{achCount}}<small style=\"font:600 18px 'Figtree',sans-serif;color:var(--muted)\"> of 5</small></div><div class=\"l\">Achievements unlocked</div></div>\n        </div>\n        <p class=\"statsub\">{{statSplit}}</p>\n\n        <div class=\"card\">\n          <div class=\"eyebrow\">Achievements</div>\n          <h2 class=\"h2\">{{achCount}} of 5 badges collected</h2>\n          <div class=\"minis\">\n            <sc-for list=\"{{minis}}\" as=\"m\" hint-placeholder-count=\"5\">\n              <span class=\"mini {{m.cls}}\" role=\"img\" aria-label=\"{{m.label}}\" title=\"{{m.name}}\">\n                <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8L12 3.5z\"></path></svg>\n              </span>\n            </sc-for>\n          </div>\n          <div class=\"row-actions\">\n            <button class=\"chip\" type=\"button\" sc-camel-on-click=\"{{goAch}}\">See all achievements</button>\n            <button class=\"chip\" type=\"button\" sc-camel-on-click=\"{{goStreaks}}\">View streaks</button>\n          </div>\n          <sc-if value=\"{{storeWarn}}\"><div class=\"demo-flag warn\" role=\"status\">Your browser is blocking storage here, so progress cannot be saved. It is kept while this page stays open, including if you sign out and back in, but it is lost when you reload or close it. Open Taskora in a normal browser window to keep it.</div></sc-if>\n          <div class=\"demo-flag\">Worked out from the tasks you finish in Personal, Shared and Work. History is saved in this browser only; syncing it across devices needs the backend.</div>\n        </div>\n\n        <div class=\"card\">\n          <div class=\"eyebrow\">Appearance</div>\n          <h2 class=\"h2\">Themes &amp; Appearance</h2>\n          <div class=\"tcur\">\n            <span class=\"tchips\" aria-hidden=\"true\"><i style=\"background: {{curC1}}\"></i><i style=\"background: {{curC2}}\"></i><i style=\"background: {{curC3}}\"></i></span>\n            <span><b>{{themeName}}</b> is active</span>\n          </div>\n          <div class=\"row-actions\">\n            <button class=\"chip chip-sm\" type=\"button\" sc-camel-on-click=\"{{goThemes}}\">Browse themes</button>\n            <sc-if value=\"{{canRestore}}\" hint-placeholder-val=\"{{false}}\"><button class=\"chip chip-sm\" type=\"button\" sc-camel-on-click=\"{{restoreTheme}}\">Restore original</button></sc-if>\n          </div>\n          <div class=\"demo-flag\">Your theme is saved on this device and stays after you sign out and back in.</div>\n        </div>\n      </div>\n    </div>\n  </section>\n  </sc-if>\n\n  <!-- ================= THEMES & APPEARANCE ================= -->\n  <sc-if value=\"{{isThemes}}\" hint-placeholder-val=\"{{false}}\">\n  <section class=\"subpage\" aria-label=\"Themes and appearance\">\n    <button class=\"back\" type=\"button\" sc-camel-on-click=\"{{goProfile}}\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"></path></svg>\n      Back to profile\n    </button>\n    <h1 class=\"page-title\">Themes &amp; Appearance</h1>\n    <p class=\"page-sub\">Choose a look for all of Taskora. Select a theme to preview it, then apply it. The sun and moon still follow your day.</p>\n\n    <div class=\"themes-grid\">\n      <div>\n        <sc-for list=\"{{themeGroups}}\" as=\"g\" hint-placeholder-count=\"5\">\n          <div class=\"tgroup\">\n            <h2 class=\"tcat\">{{g.name}}</h2>\n            <div class=\"tlist\">\n              <sc-for list=\"{{g.items}}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button class=\"tcard {{t.cls}}\" type=\"button\" sc-camel-on-click=\"{{t.pick}}\" aria-pressed=\"{{t.on}}\" aria-label=\"{{t.label}}\">\n                  <span class=\"tchips\" aria-hidden=\"true\"><i style=\"background: {{t.c1}}\"></i><i style=\"background: {{t.c2}}\"></i><i style=\"background: {{t.c3}}\"></i></span>\n                  <span class=\"trow\">\n                    <span>{{t.name}}</span>\n                    <sc-if value=\"{{t.active}}\" hint-placeholder-val=\"{{false}}\"><span class=\"tbadge\" aria-hidden=\"true\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg>Active</span></sc-if>\n                  </span>\n                </button>\n              </sc-for>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n\n      <aside class=\"card tpanel\" aria-label=\"Theme preview\">\n        <div class=\"eyebrow\">Live preview</div>\n        <h2 class=\"h2\">{{selName}}</h2>\n        <p class=\"tnote\">{{selNote}}</p>\n        <div class=\"tmocks\">\n            <div class=\"mock\" style=\"{{mockDay}}\" aria-hidden=\"true\">\n              <span class=\"mk-top\"><i class=\"mk-logo\"></i><span class=\"mk-tab on\">Personal</span><span class=\"mk-tab\">Shared</span><span class=\"mk-tab w\">Work</span><span class=\"mk-av\">M</span></span>\n              <span class=\"mk-sky\"></span>\n              <span class=\"mk-card\">\n                <span class=\"mk-row\"><span class=\"mk-chk on\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg></span><s>Plan the week</s></span>\n                <span class=\"mk-row\"><span class=\"mk-chk\"></span><span>Call the plumber</span></span>\n                <span class=\"mk-bar\"><i></i></span>\n                <span class=\"mk-act\"><span class=\"mk-btn\">Add task</span><span class=\"mk-link\">Due today</span></span>\n              </span>\n              <span class=\"mk-label\">Day</span>\n            </div>\n            <div class=\"mock\" style=\"{{mockNight}}\" aria-hidden=\"true\">\n              <span class=\"mk-top\"><i class=\"mk-logo\"></i><span class=\"mk-tab on\">Personal</span><span class=\"mk-tab\">Shared</span><span class=\"mk-tab w\">Work</span><span class=\"mk-av\">M</span></span>\n              <span class=\"mk-sky\"></span>\n              <span class=\"mk-card\">\n                <span class=\"mk-row\"><span class=\"mk-chk on\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg></span><s>Plan the week</s></span>\n                <span class=\"mk-row\"><span class=\"mk-chk\"></span><span>Call the plumber</span></span>\n                <span class=\"mk-bar\"><i></i></span>\n                <span class=\"mk-act\"><span class=\"mk-btn\">Add task</span><span class=\"mk-link\">Due today</span></span>\n              </span>\n              <span class=\"mk-label\">Night</span>\n            </div>\n        </div>\n        <span class=\"sr\">The preview shows tabs, a task list, a progress bar and buttons in the {{selName}} theme, in daytime and at night.</span>\n        <div class=\"tfoot\">\n          <button class=\"btn-primary\" type=\"button\" aria-disabled=\"{{applyOff}}\" sc-camel-on-click=\"{{applyTheme}}\">{{applyLabel}}</button>\n          <sc-if value=\"{{canRestore}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn-ghost\" type=\"button\" sc-camel-on-click=\"{{restoreTheme}}\">Restore original Taskora theme</button></sc-if>\n        </div>\n        <div class=\"fieldnote\" role=\"status\">{{themeMsg}}</div>\n      </aside>\n    </div>\n  </section>\n  </sc-if>\n\n  <!-- ================= ACHIEVEMENTS ================= -->\n  <sc-if value=\"{{isAch}}\" hint-placeholder-val=\"{{false}}\">\n  <section class=\"subpage\" aria-label=\"Achievements\">\n    <button class=\"back\" type=\"button\" sc-camel-on-click=\"{{goHome}}\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"></path></svg>\n      Back to dashboard\n    </button>\n    <h1 class=\"page-title\">Achievements</h1>\n    <p class=\"page-sub\">{{achCount}} of 5 unlocked. Badges are collected as you finish tasks. Locked ones show how far you have to go.</p>\n\n    <div class=\"badges\">\n      <sc-for list=\"{{achList}}\" as=\"a\" hint-placeholder-count=\"5\">\n        <div class=\"badge {{a.cls}}\">\n          <div class=\"medal\">\n            <sc-if value=\"{{a.isFirst}}\" hint-placeholder-val=\"{{true}}\"><svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 21V4\"></path><path d=\"M5 4h11l-2.5 4L16 12H5\"></path></svg></sc-if>\n            <sc-if value=\"{{a.isGetting}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21v-8\"></path><path d=\"M12 13c0-3.6-2.6-6-6.5-6 0 3.6 2.6 6 6.5 6z\"></path><path d=\"M12 15.5c0-3 2.2-5 5.5-5 0 3-2.2 5-5.5 5z\"></path></svg></sc-if>\n            <sc-if value=\"{{a.isConsistent}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 1.5 1 2 1.5 2C10.5 8 11 5.5 12 3z\"></path></svg></sc-if>\n            <sc-if value=\"{{a.isChampion}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 4h10v5a5 5 0 0 1-10 0V4z\"></path><path d=\"M7 6H4v1a3 3 0 0 0 3 3\"></path><path d=\"M17 6h3v1a3 3 0 0 1-3 3\"></path><path d=\"M12 14v3\"></path><path d=\"M8.5 20h7\"></path></svg></sc-if>\n            <sc-if value=\"{{a.isPerfect}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4\"></path></svg></sc-if>\n            <sc-if value=\"{{a.locked}}\" hint-placeholder-val=\"{{false}}\">\n              <span class=\"lockchip\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2.5\"></rect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"></path></svg></span>\n            </sc-if>\n          </div>\n          <div class=\"badge-name\">{{a.name}}</div>\n          <div class=\"badge-desc\">{{a.desc}}</div>\n          <sc-if value=\"{{a.hasBar}}\" hint-placeholder-val=\"{{false}}\"><div class=\"bar\"><i style=\"width: {{a.pct}}%\"></i></div></sc-if>\n          <div class=\"bstat\">{{a.status}}</div>\n          <span class=\"sr\">{{a.srState}}</span>\n        </div>\n      </sc-for>\n    </div>\n    <sc-if value=\"{{storeWarn}}\"><div class=\"demo-flag warn\" role=\"status\">Your browser is blocking storage here, so progress cannot be saved. It is kept while this page stays open, including if you sign out and back in, but it is lost when you reload or close it. Open Taskora in a normal browser window to keep it.</div></sc-if>\n    <div class=\"demo-flag\">Worked out from the tasks you finish in Personal, Shared and Work. Only tasks that are yours count, each one once. Perfect Day needs two or more of your tasks scheduled for one day, all done. Best streak and unlocked badges are kept.</div>\n  </section>\n  </sc-if>\n\n  <!-- ================= STREAKS ================= -->\n  <sc-if value=\"{{isStreaks}}\" hint-placeholder-val=\"{{false}}\">\n  <section class=\"subpage\" aria-label=\"Streaks\">\n    <button class=\"back\" type=\"button\" sc-camel-on-click=\"{{goHome}}\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"></path></svg>\n      Back to dashboard\n    </button>\n    <h1 class=\"page-title\">Streaks</h1>\n    <p class=\"page-sub\">A streak counts each day you finish at least one task. Miss a day and it starts over, but your best stays.</p>\n\n    <div class=\"streak-grid\">\n      <div class=\"card\">\n        <div class=\"eyebrow\">Current streak</div>\n        <div class=\"flame-row\" style=\"margin-top:14px\">\n          <svg class=\"flame\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\">\n            <defs><linearGradient id=\"flG\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFC83D\"></stop><stop offset=\"1\" stop-color=\"#FF6A2B\"></stop></linearGradient></defs>\n            <path d=\"M32 5c3 9 15 14 15 28a15 15 0 0 1-30 0c0-6 3-9 6-12 0 4 3 6 4.5 6C26 20 29 14 32 5z\" fill=\"url(#flG)\"></path>\n            <path d=\"M32 31c1.5 4.5 6 6.5 6 11a6 6 0 0 1-12 0c0-3 1.6-4.4 3-5.6 0 1.6 1 2.4 1.6 2.4C30 36 31 34 32 31z\" fill=\"#FFE9A8\"></path>\n          </svg>\n          <div class=\"flame-n\">{{streakNow}}<small>{{streakUnit}}</small></div>\n        </div>\n        <div class=\"bestline\"><span>Best streak</span><b>{{bestNow}} {{bestUnit}}</b></div>\n        <div class=\"cheer\" role=\"status\">{{cheer}}</div>\n      </div>\n\n      <div class=\"card\">\n        <div class=\"eyebrow\">This week</div>\n        <div class=\"weekdays\">\n          <sc-for list=\"{{weekDays}}\" as=\"w\" hint-placeholder-count=\"7\">\n            <div class=\"wd {{w.cls}}\">\n              <span class=\"circ\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg></span>\n              <span aria-hidden=\"true\">{{w.d}}</span>\n              <span class=\"sr\">{{w.sr}}</span>\n            </div>\n          </sc-for>\n        </div>\n        <div class=\"eyebrow\" style=\"margin-top:26px\">Last four weeks</div>\n        <div class=\"heat-h\" aria-hidden=\"true\"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>\n        <div class=\"heat\" role=\"img\" aria-label=\"{{heatLabel}}\">\n          <sc-for list=\"{{heat}}\" as=\"h\" hint-placeholder-count=\"28\"><span class=\"hc {{h.cls}}\"></span></sc-for>\n        </div>\n        <sc-if value=\"{{storeWarn}}\"><div class=\"demo-flag warn\" role=\"status\">Your browser is blocking storage here, so progress cannot be saved. It is kept while this page stays open, including if you sign out and back in, but it is lost when you reload or close it. Open Taskora in a normal browser window to keep it.</div></sc-if>\n        <div class=\"demo-flag\">Worked out from tasks you finish, starting the first day you use Taskora. It is saved in this browser only, because syncing history across devices needs the backend.</div>\n        <button class=\"linkbtn sm\" type=\"button\" sc-camel-on-click=\"{{clearActivity}}\" style=\"margin-top:6px\">{{actLabel}}</button>\n      </div>\n    </div>\n  </section>\n  </sc-if>\n\n</div>\n\n<!-- ================= NEW TASK SHEET ================= -->\n<sc-if value=\"{{modal}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"scrim\" sc-camel-on-click=\"{{onScrim}}\">\n    <div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\" sc-camel-on-key-down=\"{{onSheetKey}}\">\n      <div class=\"sheet-head\">\n        <h2 class=\"h2\" id=\"sheetTitle\" style=\"margin:0\">New task</h2>\n        <button class=\"close\" sc-camel-on-click=\"{{closeNew}}\" aria-label=\"Close\">\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg>\n        </button>\n      </div>\n\n      <div class=\"field\">\n        <label for=\"taskTitle\">What needs doing?</label>\n        <input id=\"taskTitle\" class=\"input {{titleCls}}\" type=\"text\" placeholder=\"Call the plumber, finish slides, buy oats\" value=\"{{title}}\" sc-camel-on-input=\"{{onTitle}}\" autocomplete=\"off\">\n        <sc-if value=\"{{titleErr}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\">Give your task a name first.</div></sc-if>\n      </div>\n\n      <div class=\"field\">\n        <span class=\"lab\">Where does it live?</span>\n        <div class=\"where\">\n          <button class=\"opt {{optPersonal}}\" sc-camel-on-click=\"{{pickPersonal}}\" aria-pressed=\"{{mPersonal}}\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2.5\"></rect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"></path></svg>\n            Personal\n            <small>Only you can see it</small>\n          </button>\n          <button class=\"opt {{optShared}}\" sc-camel-on-click=\"{{pickShared}}\" aria-pressed=\"{{mShared}}\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"></circle><path d=\"M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6\"></path><circle cx=\"17.5\" cy=\"9\" r=\"2.8\"></circle><path d=\"M17 14.2c2.6.2 4.5 2 4.5 4.8\"></path></svg>\n            Shared\n            <small>Visible to a space's members</small>\n          </button>\n          <button class=\"opt\" sc-camel-on-click=\"{{pickWork}}\" aria-pressed=\"false\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2.5\"></rect><path d=\"M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7\"></path><path d=\"M3 13h18\"></path></svg>\n            Work\n            <small>Projects, teams and roles</small>\n          </button>\n        </div>\n      </div>\n\n      <sc-if value=\"{{mShared}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"field\">\n          <span class=\"lab\">Which space?</span>\n          <div class=\"chips\">\n            <sc-for list=\"{{mSpaces}}\" as=\"s\" hint-placeholder-count=\"3\">\n              <button class=\"chip {{s.cls}}\" sc-camel-on-click=\"{{s.pick}}\" aria-pressed=\"{{s.on}}\">{{s.name}}</button>\n            </sc-for>\n          </div>\n
