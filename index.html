<body>
  <div id="__bundler_placeholder">Loading Taskora Home...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

data-phase=\"dawn\"]{--bg:#EADDF1;--glow:rgba(236,150,190,.5);--card:#FBF5FC;--stack:#D8C7E2;--sky-a:#C4AEE6;--sky-b:#F7D0DC;--star:.7}\n.app[data-phase=\"night\"]{--bg:#161227;--glow:rgba(120,90,220,.38);--ink:#F3ECFF;--muted:#B3A9CC;--line:rgba(243,236,255,.16);--card:#211B38;--paper:#2A2347;--soft:rgba(243,236,255,.08);--stack:#120E21;--personal:#FF8A5B;--shared:#4CC9C0;--work:#9AA6F2;--on-ws:#1B1228;--sky-a:#251D4B;--sky-b:#41337D;--star:1}\n.app[data-ws=\"personal\"]{--ws:var(--personal)}\n.app[data-ws=\"shared\"]{--ws:var(--shared)}\n\n.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 56px}\n\n/* ---------- top bar ---------- */\n.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:20px 0 8px}\n.brand{display:flex;align-items:center;gap:10px;font:800 24px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}\n.top .switch{margin-inline:auto}\n.top .right{display:flex;align-items:center;gap:8px;margin-left:auto}\n.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}\n.icon-btn:hover{background:var(--soft)}\n.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 'Figtree',sans-serif;color:#fff;flex:none;border:2px solid var(--card)}\n.av.lg{width:44px;height:44px;font-size:15px;border-color:var(--line)}\n.switch{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;min-width:300px}\n.switch .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--ws);border-radius:999px;transition:transform .45s cubic-bezier(.3,1.35,.5,1),background-color .4s}\n.app[data-ws=\"shared\"] .switch .pill{transform:translateX(100%)}\n.sbtn{position:relative;z-index:1;display:flex;gap:8px;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:0;background:transparent;color:var(--ink);font:600 14px/1 'Figtree',sans-serif;border-radius:999px;cursor:pointer;transition:color .3s}\n.sbtn.on{color:var(--on-ws)}\n\n/* ---------- hero ---------- */\n.hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:center;padding:28px 0 8px}\n.eyebrow{font:600 12px/1 'Figtree',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}\n.greet{margin:12px 0 0;font:800 clamp(32px,5.4vw,54px)/1.02 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;text-wrap:balance}\n.lede{margin:14px 0 0;max-width:46ch;font-size:17px;color:var(--muted)}\n.hero-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:24px}\n.btn-primary{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px 0 18px;border:0;border-radius:999px;background:var(--ws);color:var(--on-ws);font:700 16px/1 'Figtree',sans-serif;cursor:pointer;box-shadow:0 14px 26px -14px var(--ws);transition:transform .2s ease,box-shadow .2s ease}\n.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 30px -14px var(--ws)}\n.btn-primary:focus-visible,.sbtn:focus-visible,.icon-btn:focus-visible,.day:focus-visible,.chk:focus-visible,.chip:focus-visible,.space:focus-visible,.nav-btn:focus-visible,.link:focus-visible,.close:focus-visible{outline:3px solid var(--ws);outline-offset:2px}\n.privacy{display:flex;gap:10px;align-items:center;max-width:36ch;padding:10px 14px;border-radius:14px;background:var(--soft);color:var(--muted);font-size:13px;line-height:1.35}\n.privacy svg{flex:none;color:var(--ws)}\n\n/* ---------- sky identity ---------- */\n.skywrap{display:flex;flex-direction:column;gap:10px}\n.sky{position:relative;height:208px;border-radius:30px;overflow:hidden;color:var(--ink);background:linear-gradient(180deg,var(--sky-a),var(--sky-b));box-shadow:0 22px 40px -26px rgba(70,30,90,.6);transition:background .9s ease}\n.stars{position:absolute;left:0;top:0;width:100%;height:100px;opacity:var( x(0,1fr) 380px;gap:24px;margin-top:26px;align-items:start}\n.col{display:flex;flex-direction:column;gap:24px;min-width:0}\n.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 24px 40px -34px rgba(60,30,80,.55);transition:background-color .9s,border-color .6s}\n.card-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}\n.h2{margin:8px 0 0;font:700 22px/1.15 'Bricolage Grotesque',sans-serif;letter-spacing:-.015em}\n.count{font:600 13px/1 'Figtree',sans-serif;color:var(--muted);white-space:nowrap}\n.empty{padding:18px 4px;color:var(--muted)}\n\n/* ---------- tasks ---------- */\n.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}\n.task{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:16px;transition:background .2s}\n.task:hover{background:var(--soft)}\n.chk{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;background:none;border-radius:50%;cursor:pointer;padding:0}\n.chk .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-ws);transition:all .25s cubic-bezier(.3,1.5,.5,1)}\n.chk .box svg{opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.5,.5,1)}\n.task.done .chk .box{background:var(--ws);border-color:var(--ws)}\n.task.done .chk .box svg{opacity:1;transform:scale(1)}\n.tbody{flex:1;min-width:0}\n.ttitle{font-weight:600;font-size:16px;overflow-wrap:anywhere}\n.task.done .ttitle{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--line)}\n.tmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px;font-size:13px;color:var(--muted)}\n.tag{padding:3px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:600;color:var(--ink)}\n.who{display:flex;align-items:center;gap:8px;flex:none;font-size:13px;color:var(--muted)}\n.group{margin-top:14px}\n.glabel{display:flex;gap:10px;align-items:baseline;padding:0 8px 4px}\n.glabel b{font:700 15px/1 'Bricolage Grotesque',sans-serif}\n.glabel span{font-size:13px;color:var(--muted)}\n\n/* ---------- shared spaces ---------- */\n.spaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}\n.space{display:flex;flex-direction:column;gap:12px;text-align:left;padding:16px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .2s,transform .25s cubic-bezier(.3,1.4,.5,1),background-color .9s}\n.space:hover{transform:translateY(-3px)}\n.space.on{border-color:var(--ws);box-shadow:0 0 0 3px color-mix(in srgb,var(--ws) 22%,transparent)}\n.space-name{font:700 18px/1.15 'Bricolage Grotesque',sans-serif}\n.space-blurb{font-size:13px;color:var(--muted);margin-top:3px}\n.stack{display:flex}\n.stack .av{margin-left:-8px}.stack .av:first-child{margin-left:0}\n.role{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:var(--soft);font:600 11px/1 'Figtree',sans-serif;color:var(--ink)}\n.role.owner{background:var(--ws);color:var(--on-ws)}\n.space-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}\n.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}\n.bar i{display:block;height:100%;border-radius:99px;background:var(--ws);transition:width .6s ease}\n.member{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0}\n.member .nm{font-weight:600}\n.member .bar{grid-column:2/3}\n.member .fr{font-size:13px;color:var(--muted);grid-row:1/3;grid-column:3}\n.invite{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:8px;border:1.5px dashed var(--line);border-radius:16px;background:none;color:var(--ink);font:600 14px/1 'Figtree',sans-serif;cursor:pointer}\n.invite:hover{background:var(--soft)}\n\n/* ---------- fl -primary[aria-disabled=\"true\"]{opacity:.6;cursor:default;box-shadow:none;transform:none}\n.tcur{display:flex;align-items:center;gap:12px;margin-top:14px}\n.tcur .tchips{width:84px;flex:none;height:32px;border-radius:10px}\n.tcur b{font-weight:700}\n@media (max-width:900px){ .themes-grid{grid-template-columns:minmax(0,1fr)} .tpanel{position:static;order:-1} }\n@media (prefers-reduced-motion:reduce){ .tcard{transition:none} .tcard:hover{transform:none} }\n.chip.chip-sm{min-height:40px;padding:0 14px;gap:6px;font-size:13px;font-weight:600;letter-spacing:.005em;transition:background-color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}\n.chip.chip-sm:hover{background:var(--soft);border-color:var(--ws);transform:translateY(-1px);box-shadow:0 6px 12px -8px var(--ws)}\n.chip.chip-sm:active{transform:translateY(0);box-shadow:none}\n@media (prefers-reduced-motion:reduce){ .chip.chip-sm,.chip.chip-sm:hover{transition:none;transform:none} }\n/* ---------- work workspace ---------- */\n.app[data-ws=\"work\"]{--ws:var(--work)}\n.switch{grid-template-columns:repeat(3,1fr);min-width:min(350px,100%)}\n.switch .pill{width:calc((100% - 8px) / 3)}\n.app[data-ws=\"work\"] .switch .pill{transform:translateX(200%)}\n.switch .sbtn{padding:0 10px;gap:6px}\n.wk .orgs{margin-top:4px}\n.orole{font-size:11px;font-weight:700;opacity:.8;padding:3px 7px;border-radius:999px;background:var(--soft)}\n.chip.on .orole{background:rgba(255,255,255,.22)}\n.app[data-phase=\"night\"] .chip.on .orole{background:rgba(0,0,0,.18)}\n.wtabs{display:flex;gap:6px;margin-top:16px;padding:4px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow-x:auto}\n.wtab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:600 14px/1 'Figtree',sans-serif;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s}\n.wtab:hover{background:var(--soft)}\n.wtab.on{background:var(--ws);color:var(--on-ws)}\n.wtab:focus-visible,.chip:focus-visible{outline:3px solid var(--ws);outline-offset:2px}\n.wn{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(127,127,127,.18)}\n.chip.on .wn,.wtab.on .wn{background:rgba(255,255,255,.24)}\n.app[data-phase=\"night\"] .chip.on .wn,.app[data-phase=\"night\"] .wtab.on .wn{background:rgba(0,0,0,.2)}\n.wstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}\n.wstat{padding:12px;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;gap:2px}\n.wstat b{font:700 26px/1 'Bricolage Grotesque',sans-serif}\n.wstat>span{font-size:12.5px;color:var(--muted)}\n.wstat.bad b{color:#C42A41}\n.app[data-phase=\"night\"] .wstat.bad b{color:#FF8A9A}\n.wsub{margin:20px 0 8px;font:600 12px/1 'Figtree',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}\n.wbars{display:grid;gap:8px}\n.wbrow{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13.5px}\n.wbrow b{text-align:right}\n.wbrow .bar i.st-todo{background:var(--muted)}\n.wbrow .bar i.st-doing{background:var(--ws)}\n.wbrow .bar i.st-review{background:var(--shared)}\n.wbrow .bar i.st-done{background:var(--personal)}\n.wprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0}\n.wprow .bar{grid-column:1/-1}\n.wprow .fr{font-size:13px;color:var(--muted)}\n.wproj .chip{justify-self:end}\n.wfilters{display:grid;gap:8px;margin-bottom:10px}\n.wbadge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font:700 11px/1 'Figtree',sans-serif;background:var(--soft);color:var(--ink)}\n.wbadge.pr-urgent{background:#B3243A;color:#fff}\n.wbadge.pr-high{background:color-mix(in srgb,#C2410C 18%,var(--card));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,#C2410C 45%,transparent)}\n.wbadge.st-doing{background:color-mix(in srgb,var(--ws) 18%,var(--card))}\n.wbadge.st-review{background:color-mix(in srgb,var(--shared) 18%,var(--card))}\n.wbadge.st-done{background:color-mix(in srgb,var(--personal) 16%,var(--card))}\n.tmeta .late{color:#C42A41;font-weight:600}\n.app[data-phase=\"night\"] .tmeta .late{color:#FF8A9A}\n.avs{display:inline-flex}\n.avs .av{margin-left:-8px}\n.avs .av:first-child{margin-left:0}\n.wform{margin-top:6px}\n.wform .field:first-child{margin-top:12px}\n.wsubmit{margin-top:14px}\n.wmem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}\n.wmem:first-child{border-top:0}\n.wmid{min-width:0}\n.wmid .sub{overflow-wrap:anywhere;margin-top:2px}\n.wact{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}\n.input.sel{min-height:40px;width:auto;min-width:120px;padding:0 12px;font-size:14px;font-weight:600}\n.wpend{align-items:center;flex-wrap:wrap}\n.wteam{padding:12px 0;border-top:1px dashed var(--line)}\n.wteam .chips{margin-top:8px}\n.chip.ro{opacity:.6}\n.waccess{list-style:none;margin:10px 0 0;padding:0}\n.waccess li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}\n.waccess li:first-child{border-top:0}\n.waccess li.yes b{color:var(--ws)}\n.waccess li.no{color:var(--muted)}\n.wthread{list-style:none;margin:8px 0 12px;padding:0;display:grid;gap:12px}\n.wthread li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}\n.wmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.wtext{margin-top:2px;overflow-wrap:anywhere;white-space:pre-wrap}\n.sheet .chips .chip{min-height:40px}\n@media (max-width:640px){\n  .wstats{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .wbrow{grid-template-columns:84px minmax(0,1fr) 24px}\n  .wtab{padding:0 4px;font-size:12px;gap:3px}\n  .wtab .wn{padding:1px 5px;font-size:10.5px}\n  .wtabs{gap:2px}\n  .switch .sbtn{padding:0 6px;font-size:13px}\n}\n@media (min-width:700px){ .wmem{grid-template-columns:auto minmax(0,1fr) auto} .wact{grid-column:auto;justify-content:flex-end} }\n.mk-tab.w{background:var(--work);color:var(--on-ws)}\n.where{grid-template-columns:repeat(3,minmax(0,1fr))}\n.mk-tab{padding:4px 5px;font-size:10px}\n.mk-top{gap:3px}\n</style></helmet>\n\n<div class=\"app\" data-phase=\"{{phase}}\" data-ws=\"{{ws}}\" data-theme=\"{{themeId}}\" style=\"{{themeStyle}}\">\n\n<!-- ================= SIGNED OUT: SIGN IN / CREATE ACCOUNT ================= -->\n<sc-if value=\"{{signedOut}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"auth\">\n  <div class=\"auth-in\">\n    <div class=\"auth-hero\">\n      <div class=\"brand\">\n        <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 34 34\" aria-hidden=\"true\"><circle cx=\"17\" cy=\"17\" r=\"15\" fill=\"#FFB02E\"></circle><path d=\"M9.5 17.5l5.2 5.2 9.8-10.4\" fill=\"none\" stroke=\"#3A2433\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg>\n        <span>Taskora</span>\n      </div>\n      <h1 class=\"auth-title\">Organise your own life. Coordinate the things you share.</h1>\n      <ul class=\"trust\">\n        <li>\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2.5\"></rect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"></path></svg>\n          <span><b>Private by default.</b> Your tasks, notes and calendar stay yours until you choose to share.</span>\n        </li>\n        <li>\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"></circle><path d=\"M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6\"></path><circle cx=\"17.5\" cy=\"9\" r=\"2.8\"></circle><path d=\"M17 14.2c2.6.2 4.5 2 4.5 4.8\"></path></svg>\n          <span><b>Shared on purpose.</b> Invite family, friends or a study group into a space of their own.</span>\n        </li>\n        <li>\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4\"></path></svg>\n          <span><b>Warm and a little playful.</b> A calendar that flips, and a sun that gets sleepy at dusk.</span>\n        </li>\n      </ul>\n      <div class=\"privacy\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4\"></path></svg>\n        <span>{{skyTitle}}. {{skySub}}.</span>\n      </div>\n    </div>\n\n    <div class=\"card auth-card\">\n\n      <!-- Sign in -->\n      <sc-if value=\"{{isSignin}}\" hint-placeholder-val=\"{{true}}\">\n        <div class=\"eyebrow\">Sign in</div>\n        <h2 class=\"h2\">Welcome back</h2>\n        <p class=\"lead\">Pick up where you left off.</p>\n        <sc-if value=\"{{authNotice}}\" hint-placeholder-val=\"{{false}}\"><div class=\"notice\" role=\"status\">{{authNotice}}</div></sc-if>\n        <sc-if value=\"{{authError}}\" hint-placeholder-val=\"{{false}}\"><div class=\"alert\" role=\"alert\">{{authError}}</div></sc-if>\n        <form sc-camel-on-submit=\"{{onSignIn}}\" novalidate=\"\">\n          <div class=\"field\">\n            <label for=\"siEmail\">Email address</label>\n            <input id=\"siEmail\" class=\"input {{clsEmail}}\" type=\"email\" placeholder=\"you@example.com\" autocomplete=\"email\" value=\"{{siEmail}}\" sc-camel-on-input=\"{{onSiEmail}}\" aria-invalid=\"{{hasErrEmail}}\">\n            <sc-if value=\"{{hasErrEmail}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\">{{errEmail}}</div></sc-if>\n          </div>\n          <div class=\"field\">\n            <label for=\"siPw\">Password</label>\n            <div class=\"pw\">\n              <input id=\"siPw\" class=\"input {{clsPw}}\" type=\"{{siType}}\" placeholder=\"Your password\" autocomplete=\"current-password\" value=\"{{siPw}}\" sc-camel-on-input=\"{{onSiPw}}\" aria-invalid=\"{{hasErrPw}}\">\n              <button class=\"eye\" type=\"button\" sc-camel-on-click=\"{{toggleSiShow}}\" aria-label=\"{{siEyeLabel}}\" aria-pressed=\"{{siShow}}\">\n                <sc-if value=\"{{siShow}}\" hint-placeholder-val=\"{{false}}\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3l18 18\"></path><path d=\"M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a12.6 12.6 0 0 1-2.6 3.3M6.6 7.6A12.8 12.8 0 0 0 2.5 12c1 2 4.5 6 9.5 6 1.4 0 2.7-.3 3.8-.8\"></path><path d=\"M9.9 10a3 3 0 0 0 4.1 4.1\"></path></svg>\n                </sc-if>\n                <sc-if value=\"{{siHidden}}\" hint-placeholder-val=\"{{true}}\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2.5 12C3.5 10 7 6 12 6s8.5 4 9.5 6c-1 2-4.5 6-9.5 6s-8.5-4-9.5-6z\"></path><circle cx=\"12\" cy=\"12\" r=\"3\"></circle></svg>\n                </sc-if>\n              </button>\n            </div>\n            <sc-if value=\"{{hasErrPw}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\">{{errPw}}</div></sc-if>\n          </div>\n          <div class=\"row-between\">\n            <label class=\"check\"><input type=\"checkbox\" checked=\"{{siRemember}}\" sc-camel-on-change=\"{{onSiRemember}}\"> Remember me</label>\n            <button class=\"linkbtn\" type=\"button\" sc-camel-on-click=\"{{goForgot}}\">Forgot password?</button>\n          </div>\n          <button class=\"btn-primary block\" type=\"submit\" disabled=\"{{authBusy}}\">{{siBtn}}</button>\n        </form>\n        <div class=\"or\">or</div>\n        <button class=\"btn-ghost\" type=\"button\" sc-camel-on-click=\"{{useDemo}}\" disabled=\"{{authBusy}}\">Try the demo account</button>\n        <p class=\"switchline\">New to Taskora? <button class=\"linkbtn\" type=\"button\" sc-camel-on-click=\"{{goSignup}}\">Create an account</button></p>\n        <div class=\"demo-note\">\n          <b>Demo only.</b> Sign-in runs entirely in this browser. There is no server and no real account, and nothing is sent anywhere. Your demo tasks, profile and progress are saved in this browser. Demo login: <code>demo@taskora.app</code> with <code>taskora-demo</code>.\n        </div>\n      </sc-if>\n\n      <!-- Create account -->\n      <sc-if value=\"{{isSignup}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"eyebrow\">Create account</div>\n        <h2 class=\"h2\">Start your own space</h2>\n        <p class=\"lead\">Private to begin with. You decide what to share.</p>\n        <sc-if value=\"{{authError}}\" hint-placeholder-val=\"{{false}}\"><div class=\"alert\" role=\"alert\">{{authError}}</div></sc-if>\n        <form sc-camel-on-submit=\"{{onSignUp}}\" novalidate=\"\">\n          <div class=\"field\">\n            <label for=\"suName\">Full name</label>\n            <input id=\"suName\" class=\"input {{clsName}}\" type=\"text\" placeholder=\"Maya Sharma\" autocomplete=\"name\" maxlength=\"60\" value=\"{{suName}}\" sc-camel-on-input=\"{{onSuName}}\" aria-invalid=\"{{hasErrName}}\">\n            <sc-if value=\"{{hasErrName}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\">{{errName}}</div></sc-if>\n          </div>\n          <div class=\"field\">\n            <label for=\"suEmail\">Email address</label>\n            <input id=\"suEmail\" class=\"input {{clsEmail}}\" type=\"email\" placeholder=\"you@example.com\" autocomplete=\"email\" value=\"{{suEmail}}\" sc-camel-on-input=\"{{onSuEmail}}\" aria-invalid=\"{{hasErrEmail}}\">\n            <sc-if value=\"{{hasErrEmail}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\">{{errEmail}}</div></sc-if>\n          </div>\n          <div class=\"field\">\n            <label for=\"suPw\">Password</label>\n            <div class=\"pw\">\n              <input id=\"suPw\" class=\"input {{clsPw}}\" type=\"{{suType}}\" placeholder=\"At least 8 characters\" autocomplete=\"new-password\" value=\"{{suPw}}\" sc-camel-on-input=\"{{onSuPw}}\" aria-invalid=\"{{hasErrPw}}\">\n              <button class=\"eye\" type=\"button\" sc-camel-on-click=\"{{toggleSuShow}}\" aria-label=\"{{suEyeLabel}}\" aria-pressed=\"{{suShow}}\">\n                <sc-if value=\"{{suShow}}\" hint-placeholder-val=\"{{false}}\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3l18 18\"></path><path d=\"M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a12.6 12.6 0 0 1-2.6 3.3M6.6 7.6A12.8 12.8 0 0 0 2.5 12c1 2 4.5 6 9.5 6 1.4 0 2.7-.3 3.8-.8\"></path><path d=\"M9.9 10a3 3 0 0 0 4.1 4.1\"></path></svg>\n                </sc-if>\n                <sc-if value=\"{{suHidden}}\" hint-placeholder-val=\"{{true}}\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2.5 12C3.5 10 7 6 12 6s8.5 4 9.5 6c-1 2-4.5 6-9.5 6s-8.5-4-9.5-6z\"></path><circle cx=\"12\" cy=\"12\" r=\"3\"></circle></svg>\n                </sc-if>\n              </button>\n            </div>\n            <sc-if value=\"{{hasErrPw}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\">{{errPw}}</div></sc-if>\n            <div class=\"meter\" aria-hidden=\"true\">\n              <sc-for list=\"{{meter}}\" as=\"m\" hint-placeholder-count=\"4\"><i class=\"{{m.cls}}\"></i></sc-for>\n            </div>\n            <div class=\"hint\">{{meterLabel}}</div>\n          </div>\n          <div class=\"field\">\n            <label for=\"suPw2\">Confirm password</label>\n            <div class=\"pw\">\n              <input id=\"suPw2\" class=\"input {{clsPw2}}\" type=\"{{suType}}\" placeholder=\"Type it once more\" autocomplete=\"new-password\" value=\"{{suPw2}}\" sc-camel-on-input=\"{{onSuPw2}}\" aria-invalid=\"{{hasErrPw2}}\">\n            </div>\n            <sc-if value=\"{{hasErrPw2}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\">{{errPw2}}</div></sc-if>\n          </div>\n          <button class=\"btn-primary block\" type=\"submit\" disabled=\"{{authBusy}}\">{{suBtn}}</button>\n        </form>\n        <p class=\"switchline\">Already have an account? <button class=\"linkbtn\" type=\"button\" sc-camel-on-click=\"{{goSignin}}\">Sign in</button></p>\n        <div class=\"demo-note\">\n          <b>Demo only.</b> Your account lives in memory until you reload this page, and your password is never written to browser storage. New accounts start with sample tasks so you can look around. Your streak and badge history, which holds only dates and counts, is kept in this browser so it survives a reload.\n        </div>\n      </sc-if>\n\n      <!-- Forgot password -->\n      <sc-if value=\"{{isForgot}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"eyebrow\">Reset password</div>\n        <h2 class=\"h2\">Forgot your password?</h2>\n        <p class=\"lead\">Enter your email and we will show you what happens next.</p>\n        <sc-if value=\"{{authNo ath d=\"M17 14.2c2.6.2 4.5 2 4.5 4.8\"></path></svg>\n          </sc-if>\n          <span>{{privacyText}}</span>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"skywrap\">\n      <div class=\"sky\" role=\"img\" aria-label=\"{{skyAria}}\">\n        <svg class=\"stars\" sc-camel-view-box=\"0 0 240 100\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\">\n          <circle class=\"twinkle\" cx=\"22\" cy=\"20\" r=\"1.4\" fill=\"#FFF6D8\"></circle>\n          <circle class=\"twinkle t2\" cx=\"64\" cy=\"48\" r=\"1.1\" fill=\"#FFF6D8\"></circle>\n          <circle class=\"twinkle t3\" cx=\"102\" cy=\"14\" r=\"1.5\" fill=\"#FFF6D8\"></circle>\n          <circle class=\"twinkle\" cx=\"150\" cy=\"36\" r=\"1.1\" fill=\"#FFF6D8\"></circle>\n          <circle class=\"twinkle t2\" cx=\"190\" cy=\"16\" r=\"1.4\" fill=\"#FFF6D8\"></circle>\n          <circle class=\"twinkle t3\" cx=\"222\" cy=\"52\" r=\"1.2\" fill=\"#FFF6D8\"></circle>\n          <circle class=\"twinkle\" cx=\"40\" cy=\"72\" r=\"1\" fill=\"#FFF6D8\"></circle>\n          <circle class=\"twinkle t2\" cx=\"212\" cy=\"84\" r=\"1\" fill=\"#FFF6D8\"></circle>\n        </svg>\n        <svg class=\"arc\" sc-camel-view-box=\"0 0 240 120\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\">\n          <path d=\"M16 100 Q120 4 224 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-dasharray=\"2 6\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"></path>\n        </svg>\n\n        <div class=\"orb\" style=\"left: {{orbLeft}}%; top: {{orbTop}}px\">\n          <sc-if value=\"{{sunAwake}}\" hint-placeholder-val=\"{{true}}\">\n            <svg sc-camel-view-box=\"0 0 100 100\" aria-hidden=\"true\">\n              <defs><radialGradient id=\"sgA\" cx=\"38%\" cy=\"32%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#FFE48F\"></stop><stop offset=\"1\" stop-color=\"#FF9F1C\"></stop></radialGradient></defs>\n              <g class=\"rays\" stroke=\"#FFB02E\" stroke-width=
