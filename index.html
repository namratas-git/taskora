"field\">\n        <label for=\"wnTitle\">What needs doing?</label>\n        <input id=\"wnTitle\" class=\"input {{wnBad}}\" type=\"text\" placeholder=\"Draft the proposal, review the budget\" value=\"{{wnTitle}}\" sc-camel-on-input=\"{{onWnTitle}}\" autocomplete=\"off\">\n        <sc-if value=\"{{hasWnErr}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\" role=\"alert\">{{wnErr}}</div></sc-if>\n      </div>\n      <div class=\"field\">\n        <span class=\"lab\">Project or department</span>\n        <div class=\"chips\" role=\"group\" aria-label=\"Project\">\n          <sc-for list=\"{{wnProjects}}\" as=\"p\" hint-placeholder-count=\"3\"><button class=\"chip {{p.cls}}\" type=\"button\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.on}}\">{{p.name}}</button></sc-for>\n        </div>\n      </div>\n      <div class=\"field\">\n        <span class=\"lab\">Priority</span>\n        <div class=\"chips\" role=\"group\" aria-label=\"Priority\">\n          <sc-for list=\"{{wnPrio}}\" as=\"p\" hint-placeholder-count=\"4\"><button class=\"chip {{p.cls}}\" type=\"button\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.on}}\">{{p.name}}</button></sc-for>\n        </div>\n      </div>\n      <div class=\"field\">\n        <label for=\"wnDue\">Deadline</label>\n        <input id=\"wnDue\" class=\"input\" type=\"date\" value=\"{{wnDue}}\" sc-camel-on-input=\"{{onWnDue}}\">\n      </div>\n      <div class=\"field\">\n        <span class=\"lab\">Assign to</span>\n        <div class=\"chips\" role=\"group\" aria-label=\"Assign to\">\n          <sc-for list=\"{{wnWho}}\" as=\"p\" hint-placeholder-count=\"4\"><button class=\"chip {{p.cls}}\" type=\"button\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.on}}\">{{p.name}}</button></sc-for>\n        </div>\n        <div class=\"fieldnote\">{{wnWhoNote}}</div>\n      </div>\n      <div class=\"field\">\n        <label for=\"wnNotes\">Notes (optional)</label>\n        <textarea id=\"wnNotes\" class=\"input area\" rows=\"3\" placeholder=\"Context, links or acceptance criteria. Add a checklist after creating it.\" value=\"{{wnNotes}}\" sc-camel-on-input=\"{{onWnNotes}}\"></textarea>\n      </div>\n      <div class=\"sheet-foot\">\n        <button class=\"btn-quiet\" type=\"button\" sc-camel-on-click=\"{{closeWNew}}\">Cancel</button>\n        <button class=\"btn-primary\" type=\"button\" sc-camel-on-click=\"{{createWNew}}\">Add task</button>\n      </div>\n    </div>\n  </div>\n</sc-if>\n\n<!-- ================= WORK TASK DETAILS ================= -->\n<sc-if value=\"{{hasWT}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"scrim\" sc-camel-on-click=\"{{onWtScrim}}\">\n    <div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"wtH\" sc-camel-on-key-down=\"{{onWtKey}}\">\n      <div class=\"sheet-head\">\n        <div style=\"min-width:0\">\n          <div class=\"eyebrow\">Work task</div>\n          <h2 class=\"dtitle\" id=\"wtH\" style=\"margin-top:8px\">{{wtTitle}}</h2>\n          <div class=\"dmeta\">{{wtMeta}} · {{wtBy}}</div>\n        </div>\n        <button id=\"wdClose\" class=\"close\" type=\"button\" sc-camel-on-click=\"{{closeWT}}\" aria-label=\"Close\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button>\n      </div>\n      <sc-if value=\"{{wtLocked}}\" hint-placeholder-val=\"{{false}}\"><div class=\"notice\">{{wtLockNote}}</div></sc-if>\n\n      <div class=\"field\">\n        <span class=\"lab\">Status</span>\n        <div class=\"chips\" role=\"group\" aria-label=\"Status\">\n          <sc-for list=\"{{wtStatus}}\" as=\"p\" hint-placeholder-count=\"4\"><button class=\"chip {{p.cls}}\" type=\"button\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.on}}\">{{p.name}}</button></sc-for>\n        </div>\n        <div class=\"bar thin\" role=\"img\" aria-label=\"{{wtProgText}}\" style=\"margin-top:12px\"><i style=\"width: {{wtPct}}%\"></i></div>\n        <div class=\"progtxt\" role=\"status\">{{wtProgText}}</div>\n      </div>\n      <div class=\"field\">\n        <span class=\"lab\">Priority</span>\n        <div class=\"chips\" role=\"group\" aria-label=\"Priority\">\n          <sc-for list=\"{{wtPrio}}\" as=\"p\" hint-placeholder-count=\"4\"><button class=\"chip {{p.cls}}\" type=\"button\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.on}}\">{{p.name}}</button></sc-for>\n        </div>\n      </div>\n      <div class=\"field\">\n        <label for=\"wdDue\">Deadline</label>\n        <input id=\"wdDue\" class=\"input\" type=\"date\" value=\"{{wtDue}}\" sc-camel-on-input=\"{{onWtDue}}\" disabled=\"{{wtLocked}}\">\n      </div>\n      <div class=\"field\">\n        <span class=\"lab\">Project or department</span>\n        <div class=\"chips\" role=\"group\" aria-label=\"Project\">\n          <sc-for list=\"{{wtProjects}}\" as=\"p\" hint-placeholder-count=\"3\"><button class=\"chip {{p.cls}}\" type=\"button\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.on}}\">{{p.name}}</button></sc-for>\n        </div>\n      </div>\n      <div class=\"field\">\n        <span class=\"lab\">Assigned to: {{wtWhoText}}</span>\n        <div class=\"chips\" role=\"group\" aria-label=\"Assignees\">\n          <sc-for list=\"{{wtWho}}\" as=\"p\" hint-placeholder-count=\"4\"><button class=\"chip {{p.cls}}\" type=\"button\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.on}}\">{{p.name}}</button></sc-for>\n        </div>\n      </div>\n      <div class=\"field\">\n        <label for=\"wdNotes\">Notes</label>\n        <textarea id=\"wdNotes\" class=\"input area\" rows=\"3\" placeholder=\"Add details, links or decisions\" value=\"{{wtNotes}}\" sc-camel-on-input=\"{{onWtNotes}}\" disabled=\"{{wtLocked}}\"></textarea>\n      </div>\n      <div class=\"field\">\n        <span class=\"lab\">Checklist</span>\n        <sc-if value=\"{{hasWtSteps}}\" hint-placeholder-val=\"{{true}}\">\n          <ul class=\"steps\">\n            <sc-for list=\"{{wtSteps}}\" as=\"st\" hint-placeholder-count=\"3\">\n              <li class=\"task step {{st.cls}}\">\n                <button class=\"chk\" type=\"button\" sc-camel-on-click=\"{{st.toggle}}\" aria-pressed=\"{{st.done}}\" aria-label=\"{{st.aria}}\"><span class=\"box\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg></span></button>\n                <div class=\"tbody\"><div class=\"ttitle\">{{st.text}}</div></div>\n                <sc-if value=\"{{wtEdit}}\" hint-placeholder-val=\"{{true}}\"><button class=\"xbtn\" type=\"button\" sc-camel-on-click=\"{{st.remove}}\" aria-label=\"{{st.delAria}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button></sc-if>\n              </li>\n            </sc-for>\n          </ul>\n        </sc-if>\n        <sc-if value=\"{{noWtSteps}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\" style=\"margin-top:0\">No steps yet.</div></sc-if>\n        <sc-if value=\"{{wtEdit}}\" hint-placeholder-val=\"{{true}}\">\n          <div class=\"addrow\">\n            <input id=\"wdStep\" class=\"input\" type=\"text\" placeholder=\"Add a step, then press Enter\" aria-label=\"New checklist step\" value=\"{{wStep}}\" sc-camel-on-input=\"{{onWStep}}\" sc-camel-on-key-down=\"{{onWStepKey}}\" autocomplete=\"off\">\n            <button class=\"chip on\" type=\"button\" sc-camel-on-click=\"{{addWStep}}\">Add</button>\n          </div>\n        </sc-if>\n      </div>\n\n      <div class=\"field\">\n        <span class=\"lab\">Comments and updates ({{wtCommentCount}})</span>\n        <sc-if value=\"{{hasWtComments}}\" hint-placeholder-val=\"{{true}}\">\n          <ul class=\"wthread\">\n            <sc-for list=\"{{wtComments}}\" as=\"c\" hint-placeholder-count=\"2\">\n              <li><span class=\"av\" style=\"background: {{c.color}}\">{{c.initial}}</span>\n                <div><div class=\"wmeta\"><b>{{c.name}}</b> <span class=\"sub\">{{c.when}}</span><sc-if value=\"{{c.update}}\" hint-placeholder-val=\"{{false}}\"><span class=\"role\">Update</span></sc-if></div><div class=\"wtext\">{{c.text}}</div></div></li>\n            </sc-for>\n          </ul>\n        </sc-if>\n        <sc-if value=\"{{noWtComments}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\" style=\"margin-top:0\">No comments yet.</div></sc-if>\n        <sc-if value=\"{{wtComment}}\" hint-placeholder-val=\"{{true}}\">\n          <textarea id=\"wdComment\" class=\"input area\" rows=\"2\" placeholder=\"Write a comment or share an update\" aria-label=\"New comment\" value=\"{{wComment}}\" sc-camel-on-input=\"{{onWComment}}\"></textarea>\n          <div class=\"addrow\" style=\"margin-top:8px\">\n            <div class=\"chips\" role=\"group\" aria-label=\"Post as\">\n              <sc-for list=\"{{wCKinds}}\" as=\"k\" hint-placeholder-count=\"2\"><button class=\"chip chip-sm {{k.cls}}\" type=\"button\" sc-camel-on-click=\"{{k.pick}}\" aria-pressed=\"{{k.on}}\">{{k.name}}</button></sc-for>\n            </div>\n            <button class=\"chip on\" type=\"button\" sc-camel-on-click=\"{{postWComment}}\">Post</button>\n          </div>\n          <div class=\"fieldnote\">Comments appear for everyone who opens this task in this tab. Delivering them to other people in real time needs a backend.</div>\n        </sc-if>\n        <sc-if value=\"{{wtNoComment}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\">Viewers can read comments but not post them.</div></sc-if>\n      </div>\n\n      <div class=\"sheet-foot\">\n        <sc-if value=\"{{wtDelete}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn-quiet\" type=\"button\" sc-camel-on-click=\"{{wtDel}}\">{{wtDelLabel}}</button></sc-if>\n        <button class=\"btn-primary\" type=\"button\" sc-camel-on-click=\"{{closeWT}}\">Done</button>\n      </div>\n    </div>\n  </div>\n</sc-if>\n\n<!-- ================= TASK DETAILS: NOTES + CHECKLIST ================= -->\n<sc-if value=\"{{hasDetail}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"scrim\" sc-camel-on-click=\"{{onDScrim}}\">\n    <div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dTitleH\" sc-camel-on-key-down=\"{{onDKey}}\">\n      <div class=\"sheet-head\">\n        <div style=\"min-width:0\">\n          <div class=\"eyebrow\">Task</div>\n          <h2 class=\"dtitle\" id=\"dTitleH\" style=\"margin-top:8px\">{{dTitle}}</h2>\n          <div class=\"dmeta\">{{dMeta}}</div>\n        </div>\n        <button id=\"dClose\" class=\"close\" type=\"button\" sc-camel-on-click=\"{{closeDetail}}\" aria-label=\"Close\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button>\n      </div>\n      <button class=\"chip done-chip {{dDoneCls}}\" type=\"button\" sc-camel-on-click=\"{{dToggle}}\" aria-pressed=\"{{dDone}}\">{{dDoneLabel}}</button>\n\n      <div class=\"field\">\n        <label for=\"dNotes\">Notes</label>\n        <textarea id=\"dNotes\" class=\"input area\" rows=\"4\" placeholder=\"Add details, links or reminders\" value=\"{{dNotes}}\" sc-camel-on-input=\"{{onDNotes}}\" disabled=\"{{dReadOnly}}\"></textarea>\n        <sc-if value=\"{{dReadOnly}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\">You are a viewer in this space, so notes and checklists are read-only.</div></sc-if>\n      </div>\n\n      <div class=\"field\">\n        <span class=\"lab\">Checklist</span>\n        <sc-if value=\"{{hasSteps}}\" hint-placeholder-val=\"{{true}}\">\n          <div class=\"bar thin\" role=\"img\" aria-label=\"{{dProg}}\"><i style=\"width: {{dPct}}%\"></i></div>\n          <div class=\"progtxt\" role=\"status\">{{dProg}}</div>\n          <ul class=\"steps\">\n            <sc-for list=\"{{dSteps}}\" as=\"st\" hint-placeholder-count=\"3\">\n              <li class=\"task step {{st.cls}}\">\n                <button class=\"chk\" type=\"button\" sc-camel-on-click=\"{{st.toggle}}\" aria-pressed=\"{{st.done}}\" aria-label=\"{{st.aria}}\">\n                  <span class=\"box\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"></path></svg></span>\n                </button>\n                <div class=\"tbody\"><div class=\"ttitle\">{{st.text}}</div></div>\n                <sc-if value=\"{{dCanEdit}}\" hint-placeholder-val=\"{{true}}\">\n                  <button class=\"xbtn\" type=\"button\" sc-camel-on-click=\"{{st.remove}}\" aria-label=\"{{st.delAria}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button>\n                </sc-if>\n              </li>\n            </sc-for>\n          </ul>\n        </sc-if>\n        <sc-if value=\"{{noSteps}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\" style=\"margin-top:0\">No steps yet. Break the task into small pieces and tick them off.</div></sc-if>\n        <sc-if value=\"{{dCanEdit}}\" hint-placeholder-val=\"{{true}}\">\n          <div class=\"addrow\">\n            <input id=\"dNew\" class=\"input\" type=\"text\" placeholder=\"Add a step, then press Enter\" aria-label=\"New checklist step\" value=\"{{dNew}}\" sc-camel-on-input=\"{{onDNew}}\" sc-camel-on-key-down=\"{{onDNewKey}}\" autocomplete=\"off\">\n            <button class=\"chip on\" type=\"button\" sc-camel-on-click=\"{{addStep}}\">Add</button>\n          </div>\n        </sc-if>\n      </div>\n\n      <div class=\"sheet-foot\"><button class=\"btn-primary\" type=\"button\" sc-camel-on-click=\"{{closeDetail}}\">Done</button></div>\n    </div>\n  </div>\n</sc-if>\n\n<!-- ================= SEARCH ================= -->\n<sc-if value=\"{{searchOpen}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"scrim top-sheet\" sc-camel-on-click=\"{{onSearchScrim}}\">\n    <div class=\"sheet wide\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Search\" sc-camel-on-key-down=\"{{onSearchKey}}\">\n      <div class=\"sbar\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"></circle><path d=\"M20 20l-4.2-4.2\"></path></svg>\n        <input id=\"sInput\" type=\"text\" placeholder=\"Search tasks, notes, people, pages\" aria-label=\"Search\" value=\"{{q}}\" sc-camel-on-input=\"{{onQ}}\" autocomplete=\"off\">\n        <button class=\"close\" type=\"button\" sc-camel-on-click=\"{{closeSearch}}\" aria-label=\"Close search\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button>\n      </div>\n      <div class=\"shint\" role=\"status\">{{sHint}}</div>\n      <div class=\"sresults\">\n        <sc-for list=\"{{sGroups}}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div class=\"sgroup\">{{g.label}}</div>\n          <sc-for list=\"{{g.items}}\" as=\"r\" hint-placeholder-count=\"3\">\n            <button class=\"sres {{r.cls}}\" type=\"button\" sc-camel-on-click=\"{{r.pick}}\">\n              <span class=\"st\">\n                <span class=\"sn\"><sc-for list=\"{{r.title}}\" as=\"w\" hint-placeholder-count=\"1\"><span class=\"{{w.cls}}\">{{w.t}}</span></sc-for></span>\n                <span class=\"ss\"><sc-for list=\"{{r.sub}}\" as=\"w\" hint-placeholder-count=\"1\"><span class=\"{{w.cls}}\">{{w.t}}</span></sc-for></span>\n              </span>\n              <span class=\"kind\">{{r.kind}}</span>\n            </button>\n          </sc-for>\n        </sc-for>\n        <sc-if value=\"{{sNone}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nempty\">{{sNoneText}}</div></sc-if>\n      </div>\n    </div>\n  </div>\n</sc-if>\n\n<!-- ================= SUN LOCATION ================= -->\n<sc-if value=\"{{locOpen}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"scrim\" sc-camel-on-click=\"{{onLocScrim}}\">\n    <div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"locH\" sc-camel-on-key-down=\"{{onLocKey}}\">\n      <div class=\"sheet-head\">\n        <h2 class=\"h2\" id=\"locH\" style=\"margin:0\">Sun times location</h2>\n        <button class=\"close\" type=\"button\" sc-camel-on-click=\"{{closeLoc}}\" aria-label=\"Close\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button>\n      </div>\n      <p class=\"fieldnote\" style=\"margin-top:10px\"><b>Now using:</b> {{locCurrent}}. {{locCurrentNote}}</p>\n      <sc-if value=\"{{hasLocMsg}}\" hint-placeholder-val=\"{{false}}\"><div class=\"{{locMsgCls}}\" role=\"status\">{{locMsg}}</div></sc-if>\n\n      <button id=\"locUse\" class=\"btn-primary block\" type=\"button\" sc-camel-on-click=\"{{useMyLocation}}\" disabled=\"{{locBusy}}\">{{locUseLabel}}</button>\n      <p class=\"fineprint fine\">Your browser will ask first. Taskora works out sunrise and sunset on this device and keeps only a place name and rounded coordinates in this browser. Nothing is sent anywhere.</p>\n\n      <div class=\"field\">\n        <label for=\"locQ\">Or search for a city</label>\n        <input id=\"locQ\" class=\"input\" type=\"text\" placeholder=\"Mumbai, Reykjavik, Sydney\" value=\"{{locQuery}}\" sc-camel-on-input=\"{{onLocQuery}}\" autocomplete=\"off\">\n        <div class=\"lres\">\n          <sc-for list=\"{{locResults}}\" as=\"c\" hint-placeholder-count=\"2\"><button class=\"chip\" type=\"button\" sc-camel-on-click=\"{{c.pick}}\">{{c.name}}</button></sc-for>\n        </div>\n        <sc-if value=\"{{locNoResults}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fieldnote\">That city is not in the built-in list. Enter its coordinates below instead. Searching every place on Earth would need an external geocoding service.</div></sc-if>\n      </div>\n\n      <form class=\"field\" sc-camel-on-submit=\"{{applyCoords}}\" novalidate=\"\">\n        <span class=\"lab\">Or enter coordinates</span>\n        <div class=\"pair\">\n          <input class=\"input\" type=\"text\" inputmode=\"decimal\" placeholder=\"Latitude, e.g. 19.08\" aria-label=\"Latitude\" value=\"{{locLat}}\" sc-camel-on-input=\"{{onLocLat}}\">\n          <input class=\"input\" type=\"text\" inputmode=\"decimal\" placeholder=\"Longitude, e.g. 72.88\" aria-label=\"Longitude\" value=\"{{locLon}}\" sc-camel-on-input=\"{{onLocLon}}\">\n        </div>\n        <sc-if value=\"{{hasLocErr}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\" role=\"alert\">{{locErr}}</div></sc-if>\n        <button class=\"chip\" type=\"submit\" style=\"margin-top:10px\">Use these coordinates</button>\n      </form>\n\n      <div class=\"sheet-foot\">\n        <sc-if value=\"{{canResetLoc}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn-quiet\" type=\"button\" sc-camel-on-click=\"{{resetLoc}}\">Forget my place</button></sc-if>\n        <button class=\"btn-primary\" type=\"button\" sc-camel-on-click=\"{{closeLoc}}\">Done</button>\n      </div>\n    </div>\n  </div>\n</sc-if>\n\n<!-- ================= INVITE ================= -->\n<sc-if value=\"{{invOpen}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"scrim\" sc-camel-on-click=\"{{onInvScrim}}\">\n    <div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"invH\" sc-camel-on-key-down=\"{{onInvKey}}\">\n      <div class=\"sheet-head\">\n        <h2 class=\"h2\" id=\"invH\" style=\"margin:0\">Invite to {{invSpace}}</h2>\n        <button class=\"close\" type=\"button\" sc-camel-on-click=\"{{closeInvite}}\" aria-label=\"Close\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button>\n      </div>\n      <sc-if value=\"{{notOwner}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"notice\" role=\"status\">Only the owner of {{invSpace}} ({{invOwnerName}}) can invite people. Ask them to add anyone new.</div>\n      </sc-if>\n      <sc-if value=\"{{iAmOwner}}\" hint-placeholder-val=\"{{true}}\">\n        <form sc-camel-on-submit=\"{{sendInvite}}\" novalidate=\"\">\n          <div class=\"field\">\n            <label for=\"invEmail\">Their email address</label>\n            <input id=\"invEmail\" class=\"input {{invEmailCls}}\" type=\"email\" inputmode=\"email\" placeholder=\"friend@example.com\" value=\"{{invEmail}}\" sc-camel-on-input=\"{{onInvEmail}}\" autocomplete=\"off\">\n            <sc-if value=\"{{hasInvErr}}\" hint-placeholder-val=\"{{false}}\"><div class=\"errmsg\" role=\"alert\">{{invErr}}</div></sc-if>\n          </div>\n          <div class=\"field\">\n            <span class=\"lab\">What can they do?</span>\n            <div class=\"chips\">\n              <button class=\"chip {{invEditorCls}}\" type=\"button\" sc-camel-on-click=\"{{pickEditor}}\" aria-pressed=\"{{invEditor}}\">Editor: add and edit tasks</button>\n              <button class=\"chip {{invViewerCls}}\" type=\"button\" sc-camel-on-click=\"{{pickViewer}}\" aria-pressed=\"{{invViewer}}\">Viewer: follow along</button>\n            </div>\n          </div>\n          <button class=\"btn-primary block\" type=\"submit\">Save invitation</button>\n        </form>\n        <div class=\"notice\" role=\"note\">Taskora cannot send email yet. Emailing the invitation, matching it to the person's account and letting them accept it all need a backend and an email service. For now an invitation is saved here as pending, and you can copy the message and send it yourself.</div>\n\n        <sc-if value=\"{{hasInv}}\" hint-placeholder-val=\"{{false}}\">\n          <div class=\"field\">\n            <span class=\"lab\">{{pendingLabel}}</span>\n            <sc-for list=\"{{invRows}}\" as=\"iv\" hint-placeholder-count=\"1\">\n              <div class=\"invrow\">\n                <span class=\"em\">{{iv.email}}</span>\n                <span class=\"wh\">{{iv.when}}</span>\n                <div class=\"acts\">\n                  <button class=\"chip\" type=\"button\" sc-camel-on-click=\"{{iv.flip}}\" aria-label=\"{{iv.roleAria}}\">{{iv.roleLabel}}</button>\n                  <button class=\"chip\" type=\"button\" sc-camel-on-click=\"{{iv.copy}}\" aria-label=\"{{iv.copyAria}}\">Copy message</button>\n                  <button class=\"chip\" type=\"button\" sc-camel-on-click=\"{{iv.revoke}}\" aria-label=\"{{iv.revokeAria}}\">Revoke</button>\n                </div>\n              </div>\n            </sc-for>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{hasInvMsg}}\" hint-placeholder-val=\"{{false}}\">\n          <div class=\"field\">\n            <label for=\"invMsg\">Message for {{invMsgFor}}</label>\n            <textarea id=\"invMsg\" class=\"input area\" rows=\"7\" readonly=\"\" value=\"{{invMsg}}\"></textarea>\n          </div>\n        </sc-if>\n      </sc-if>\n      <div class=\"sheet-foot\"><button class=\"btn-primary\" type=\"button\" sc-camel-on-click=\"{{closeInvite}}\">Done</button></div>\n    </div>\n  </div>\n</sc-if>\n\n<sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"toast\" role=\"status\">{{toast}}</div>\n</sc-if>\n</sc-if>\n\n<!-- ================= WELCOME TRANSITION ================= -->\n<sc-if value=\"{{welcome}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"welcome\" role=\"status\">\n    <div class=\"welcome-in\">\n      <div class=\"w-mark\">\n        <svg width=\"96\" height=\"96\" sc-camel-view-box=\"0 0 34 34\" aria-hidden=\"true\"><circle cx=\"17\" cy=\"17\" r=\"15\" fill=\"#FFB02E\"></circle><path d=\"M9.5 17.5l5.2 5.2 9.8-10.4\" fill=\"none\" stroke=\"#3A2433\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg>\n      </div>\n      <div class=\"w-title\">{{welcomeTitle}}</div>\n      <div class=\"w-sub\">{{welcomeSub}}</div>\n    </div>\n  </div>\n</sc-if>\n\n<div class=\"veil\" aria-hidden=\"true\" style=\"background: {{veilColor}}; opacity: {{veilOpacity}}\"></div>\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:1280}}\">\nconst pad = n => String(n).padStart(2, '0');\nconst dk = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);\nconst MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst M3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst D3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nconst DL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\nlet TY, TM, TD, TODAY;\nfunction setToday(d) { TY = d.getFullYear(); TM = d.getMonth(); TD = d.getDate(); TODAY = dk(TY, TM, TD); }\nsetToday(new Date());                         // the real local date, re-read every 30 seconds\nconst parse = k => { const p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };\nconst shiftKey = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dk(d.getFullYear(), d.getMonth(), d.getDate()); };\nconst addDays = n => shiftKey(TODAY, n);\nconst nice = k => { const d = parse(k); return D3[d.getDay()] + ' ' + d.getDate() + ' ' + M3[d.getMonth()]; };\nconst shortDate = k => { const d = parse(k); return d.getDate() + ' ' + M3[d.getMonth()]; };\nconst diff = k => Math.round((parse(k) - parse(TODAY)) / 86400000);\nconst fmt = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; const h = Math.floor(m / 60); const mm = m % 60; return (((h + 11) % 12) + 1) + ':' + pad(mm) + (h >= 12 ? ' pm' : ' am'); };\nconst dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60); const mm = m % 60; return h > 0 ? h + 'h ' + mm + 'm' : mm + 'm'; };\nconst nowMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };\n\n/* ======================================================================\n   SUN TIMES\n   Calculated on this device with NOAA's solar equations, so no network,\n   API key or account is needed. Accurate to about a minute away from the\n   poles. It only needs a latitude, a longitude and a time zone.\n   ====================================================================== */\nconst RAD = Math.PI / 180;\nconst jdOf = ms => ms / 86400000 + 2440587.5;\nfunction sunPos(jd) {\n  const T = (jd - 2451545) / 36525;\n  const L0 = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;\n  const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);\n  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);\n  const C = Math.sin(M * RAD) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M * RAD) * (0.019993 - 0.000101 * T) + Math.sin(3 * M * RAD) * 0.000289;\n  const om = 125.04 - 1934.136 * T;\n  const lam = L0 + C - 0.00569 - 0.00478 * Math.sin(om * RAD);\n  const eps = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60 + 0.00256 * Math.cos(om * RAD);\n  const decl = Math.asin(Math.sin(eps * RAD) * Math.sin(lam * RAD)) / RAD;\n  const y = Math.pow(Math.tan(eps * RAD / 2), 2);\n  const eqt = 4 / RAD * (y * Math.sin(2 * L0 * RAD) - 2 * e * Math.sin(M * RAD) + 4 * e * y * Math.sin(M * RAD) * Math.cos(2 * L0 * RAD) - 0.5 * y * y * Math.sin(4 * L0 * RAD) - 1.25 * e * e * Math.sin(2 * M * RAD));\n  return { decl, eqt };\n}\n/* one sunrise or sunset for the solar day that belongs to the civil date whose UTC midnight is dayMs */\nfunction sunEvent(dayMs, lat, lon, isRise) {\n  let minutes = 720 - 4 * lon;\n  for (let i = 0; i < 3; i++) {\n    const sp = sunPos(jdOf(dayMs) + minutes / 1440);\n    const cosH = (Math.cos(90.833 * RAD) - Math.sin(lat * RAD) * Math.sin(sp.decl * RAD)) / (Math.cos(lat * RAD) * Math.cos(sp.decl * RAD));\n    if (cosH > 1) return { polar: 'night' };\n    if (cosH < -1) return { polar: 'day' };\n    const H = Math.acos(cosH) / RAD;\n    const noon = 720 - 4 * lon - sp.eqt;\n    minutes = isRise ? noon - 4 * H : noon + 4 * H;\n  }\n  return { ms: dayMs + Math.round(minutes) * 60000 };\n}\nconst fmtCache = {};\nconst deviceTz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; } };\nconst tzOk = tz => { try { new Intl.DateTimeFormat('en-GB', { timeZone: tz }); return true; } catch (e) { return false; } };\nfunction zoneParts(ts, tz) {\n  let f = fmtCache[tz];\n  if (!f) f = fmtCache[tz] = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });\n  const o = {};\n  f.formatToParts(new Date(ts)).forEach(p => { o[p.type] = p.value; });\n  return { y: +o.year, m: +o.month - 1, d: +o.day, min: (+o.hour % 24) * 60 + +o.minute };\n}\nconst zoneOffsetMin = (ts, tz) => { const z = zoneParts(ts, tz); return Math.round((Date.UTC(z.y, z.m, z.d) + z.min * 60000 - Math.floor(ts / 60000) * 60000) / 60000); };\nconst clockAt = (ms, tz) => fmt(zoneParts(ms, tz).min);\n\n/* Where is the sun at instant ts, for a place? Returns phase, arc progress, the next event and today's times. */\nfunction skyFor(loc, ts) {\n  const z = zoneParts(ts, loc.tz);\n  const evs = []; let polar = null, today = null;\n  for (let k = -1; k <= 1; k++) {\n    const dt = new Date(Date.UTC(z.y, z.m, z.d + k));\n    const base = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());\n    const r = sunEvent(base, loc.lat, loc.lon, true), q = sunEvent(base, loc.lat, loc.lon, false);\n    if (r.polar || q.polar) { if (k === 0) polar = r.polar || q.polar; continue; }\n    evs.push({ ms: r.ms, rise: true }); evs.push({ ms: q.ms, rise: false });\n    if (k === 0) today = { rise: r.ms, set: q.ms };\n  }\n  evs.sort((a, b) => a.ms - b.ms);\n  let prev = null, next = null;\n  evs.forEach(e => { if (e.ms <= ts) prev = e; else if (!next) next = e; });\n  const out = { min: z.min, polar, today, phase: 'day', p: z.min / 1440, next: null, toNext: 0 };\n  if (polar) { out.phase = polar === 'day' ? 'day' : 'night'; return out; }\n  if (!prev || !next) { out.phase = z.min >= 420 && z.min < 1140 ? 'day' : 'night'; return out; }\n  out.p = Math.max(0, Math.min(1, (ts - prev.ms) / (next.ms - prev.ms)));\n  out.next = next; out.toNext = Math.round((next.ms - ts) / 60000);\n  const soon = next.ms - ts <= 3600000;\n  out.phase = prev.rise ? (soon ? 'dusk' : 'day') : (soon ? 'dawn' : 'night');\n  return out;\n}\n\nconst TZ_ALIAS = { 'Asia/Calcutta': 'Asia/Kolkata', 'Asia/Katmandu': 'Asia/Kathmandu', 'Asia/Saigon': 'Asia/Ho_Chi_Minh', 'Asia/Rangoon': 'Asia/Yangon', 'America/Buenos_Aires': 'America/Argentina/Buenos_Aires', 'Europe/Kiev': 'Europe/Kyiv' };\n/* name, country, latitude, longitude, IANA time zone */\nconst CITIES = [\n  ['New Delhi','India',28.61,77.21,'Asia/Kolkata'],['Mumbai','India',19.08,72.88,'Asia/Kolkata'],['Bengaluru','India',12.97,77.59,'Asia/Kolkata'],['Chennai','India',13.08,80.27,'Asia/Kolkata'],['Kolkata','India',22.57,88.36,'Asia/Kolkata'],['Hyderabad','India',17.39,78.49,'Asia/Kolkata'],['Pune','India',18.52,73.86,'Asi
